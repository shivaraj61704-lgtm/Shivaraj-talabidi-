 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF & PPT Editor</title>

<!-- ================= PDF.JS ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- ================= PDF-LIB ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<!-- ================= JSZIP ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- ================= PPTXGENJS ================= -->
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f5;
    color:#202124;
}

button,
input,
select{
    font-family:Arial,Helvetica,sans-serif;
}

button{
    cursor:pointer;
}

/* =========================================================
HEADER
========================================================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    background:#ffffff;
    border-bottom:1px solid #dcdfe3;
    display:flex;
    align-items:center;
    padding:0 16px;
    z-index:1000;
}

.logo{
    font-size:20px;
    font-weight:700;
    white-space:nowrap;
}

.logo span{
    color:#1677ff;
}

.mode-buttons{
    display:flex;
    gap:5px;
    margin-left:25px;
}

.mode-buttons button{
    border:1px solid #d7dbe0;
    background:#fff;
    padding:8px 14px;
    border-radius:7px;
}

.mode-buttons button.active{
    background:#1677ff;
    color:#fff;
    border-color:#1677ff;
}

.header-right{
    margin-left:auto;
    display:flex;
    gap:7px;
}

.header-btn{
    background:#fff;
    border:1px solid #d7dbe0;
    padding:9px 12px;
    border-radius:7px;
}

.download-btn{
    background:#1677ff;
    color:#fff;
    border:none;
    padding:10px 17px;
    border-radius:7px;
    font-weight:bold;
}

/* =========================================================
MAIN
========================================================= */

.app{
    position:absolute;
    top:64px;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    overflow:hidden;
}

/* =========================================================
LEFT TOOLBAR
========================================================= */

.toolbar{
    width:220px;
    min-width:220px;
    background:#fff;
    border-right:1px solid #ddd;
    padding:12px;
    overflow-y:auto;
}

.section-title{
    font-size:11px;
    color:#777;
    font-weight:bold;
    text-transform:uppercase;
    margin:8px 0;
}

.tool{
    width:100%;
    border:1px solid #e0e3e7;
    background:#fff;
    border-radius:7px;
    padding:10px;
    margin-bottom:7px;
    text-align:left;
}

.tool:hover{
    background:#f4f6f8;
}

.tool.blue{
    background:#1677ff;
    color:white;
    border-color:#1677ff;
}

.tool.red{
    color:#d93025;
}

.divider{
    border-top:1px solid #e2e2e2;
    margin:14px 0;
}

.text-control{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:7px;
}

.color-control{
    width:45px;
    height:34px;
}

/* =========================================================
ADD MENU
========================================================= */

.add-menu{
    display:none;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:6px;
    margin-bottom:7px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.add-menu.show{
    display:block;
}

.add-menu button{
    width:100%;
    border:none;
    background:#f5f6f7;
    padding:9px;
    margin:3px 0;
    border-radius:6px;
    text-align:left;
}

.add-menu button:hover{
    background:#e9edf2;
}

/* =========================================================
PAGE PANEL
========================================================= */

.page-panel{
    width:190px;
    min-width:190px;
    background:#f7f8fa;
    border-right:1px solid #ddd;
    overflow-y:auto;
    padding:10px;
}

.page-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2px 3px 10px;
    font-size:13px;
    font-weight:bold;
    color:#555;
}

.thumbnail{
    background:white;
    border:2px solid transparent;
    border-radius:7px;
    padding:5px;
    margin-bottom:11px;
    position:relative;
    cursor:pointer;
}

.thumbnail:hover{
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.thumbnail.active{
    border-color:#1677ff;
}

.thumbnail.dragging{
    opacity:.35;
}

.thumbnail.dragover{
    border-color:#1677ff;
}

.thumbnail canvas{
    width:100%;
    height:auto;
    display:block;
    background:#fff;
}

.thumb-name{
    text-align:center;
    font-size:11px;
    color:#666;
    padding-top:4px;
}

.thumb-delete{
    position:absolute;
    right:3px;
    top:3px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e53935;
    color:#fff;
    padding:0;
    font-size:15px;
}

/* =========================================================
EDITOR
========================================================= */

.editor{
    flex:1;
    position:relative;
    overflow:auto;
    background:#dce1e7;
}

.editor-area{
    min-width:100%;
    min-height:100%;
    padding:35px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.page-wrapper{
    position:relative;
    background:#fff;
    box-shadow:0 5px 25px rgba(0,0,0,.25);
    display:none;
}

#mainCanvas{
    display:block;
}

/* =========================================================
OVERLAY ELEMENTS
========================================================= */

.overlay{
    position:absolute;
    user-select:none;
    cursor:move;
    border:1px dashed transparent;
}

.overlay:hover,
.overlay.selected{
    border-color:#1677ff;
}

.overlay-text{
    white-space:nowrap;
    padding:3px 5px;
}

.overlay-watermark{
    white-space:nowrap;
    padding:3px 5px;
}

.overlay-image{
    overflow:hidden;
}

.overlay-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.overlay-delete{
    position:absolute;
    right:-10px;
    top:-10px;
    width:20px;
    height:20px;
    padding:0;
    border:none;
    border-radius:50%;
    background:#e53935;
    color:#fff;
    display:none;
}

.overlay.selected .overlay-delete{
    display:block;
}

/* =========================================================
EMPTY SCREEN
========================================================= */

.empty-screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.empty-card{
    width:440px;
    max-width:90%;
    background:white;
    padding:45px 30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.empty-icon{
    font-size:55px;
}

.empty-card h2{
    margin:10px 0;
}

.empty-card p{
    color:#777;
    line-height:1.5;
}

.empty-card button{
    background:#1677ff;
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:7px;
}

/* =========================================================
STATUS
========================================================= */

.status{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#202124;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    display:none;
    z-index:5000;
}

/* =========================================================
LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:6000;
}

.loading-box{
    background:#fff;
    padding:28px 38px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

.spinner{
    width:38px;
    height:38px;
    border:4px solid #ddd;
    border-top-color:#1677ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 13px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:750px){

    .toolbar{
        width:175px;
        min-width:175px;
    }

    .page-panel{
        display:none;
    }

    .mode-buttons{
        display:none;
    }

    .header-btn{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================================================
HEADER
========================================================= -->

<header class="header">

    <div class="logo">
        <span>PDF</span> & PPT Editor
    </div>

    <div class="mode-buttons">

        <button
            id="pdfMode"
            class="active"
            onclick="setMode('pdf')">
            📄 PDF
        </button>

        <button
            id="pptMode"
            onclick="setMode('ppt')">
            📊 PPT
        </button>

    </div>

    <div class="header-right">

        <button
            class="header-btn"
            onclick="openDocument()">
            📂 Open
        </button>

        <button
            class="header-btn"
            onclick="undo()">
            ↶
        </button>

        <button
            class="header-btn"
            onclick="redo()">
            ↷
        </button>

        <button
            class="download-btn"
            onclick="downloadDocument()">
            ⬇ Download
        </button>

    </div>

</header>


<!-- =========================================================
APP
========================================================= -->

<div class="app">

<!-- =========================================================
TOOLBAR
========================================================= -->

<aside class="toolbar">

    <div class="section-title">
        Document
    </div>

    <button
        class="tool blue"
        onclick="openDocument()">
        📂 Open PDF / PPTX
    </button>

    <button
        class="tool blue"
        onclick="toggleAddMenu()">
        ➕ Add Page / Slide
    </button>

    <div
        id="addMenu"
        class="add-menu">

        <button onclick="addBlankPage()">
            📄 Blank Page / Slide
        </button>

        <button onclick="choosePDFPages()">
            📥 Add PDF Pages
        </button>

        <button onclick="choosePPTPages()">
            📊 Add PPTX Slides
        </button>

        <button onclick="chooseImagePage()">
            🖼️ Add Image as Page
        </button>

    </div>


    <div class="section-title">
        Add
    </div>

    <button
        class="tool"
        onclick="addText()">
        ✏️ Add Text
    </button>

    <button
        class="tool"
        onclick="addImage()">
        🖼️ Add Photo
    </button>

    <button
        class="tool"
        onclick="addWatermark()">
        💧 Add Watermark
    </button>


    <div class="divider"></div>


    <div class="section-title">
        Text
    </div>

    <input
        id="textInput"
        class="text-control"
        type="text"
        placeholder="Enter text">

    <input
        id="fontSize"
        class="text-control"
        type="number"
        min="5"
        max="200"
        value="24">

    <div style="font-size:12px;margin-bottom:4px">
        Text Color
    </div>

    <input
        id="textColor"
        class="color-control"
        type="color"
        value="#000000">


    <div class="divider"></div>


    <div class="section-title">
        Watermark

    <input
        id="watermarkInput"

    <div class="section-title">
        Page / Slide

    <button

    <button

        🧹 Clear Added Items

    <button

    <button

</aside>


<!-- =========================================================
PAGE PANEL

<aside class="page-panel">

<script>

/* =========================================================
PDF WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
GLOBAL STATE
========================================================= */

let mode = "pdf";

let pages = [];

let currentPage = 0;

let zoom = 1.25;

let originalPDF = null;

let originalPDFDocument = null;

let originalPPT = null;

let undoStack = [];

let redoStack = [];

/*
IMPORTANT:

Each PPT slide gets its own completed PNG snapshot.

This is the main fix for slide mixing.
*/

let pptRenderCache = new Map();


/* =========================================================
UTILITY
========================================================= */

function showStatus(message){

    const el =
        document.getElementById("status");

    el.innerText = message;

    el.style.display = "block";

    clearTimeout(
        window.statusTimer
    );

    window.statusTimer =
        setTimeout(
            ()=>{
                el.style.display="none";
            },
            2500
        );

}


function showLoading(message){

    document.getElementById(
        "loadingText"
    ).innerText = message;

    document.getElementById(
        "loading"
    ).style.display = "flex";

}


function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display = "none";

}


/* =========================================================
MODE
========================================================= */

function setMode(newMode){

    mode = newMode;

    document
        .getElementById("pdfMode")
        .classList.toggle(
            "active",
            mode === "pdf"
        );

    document
        .getElementById("pptMode")
        .classList.toggle(
            "active",
            mode === "ppt"
        );

    document
        .getElementById("panelTitle")
        .innerText =
        mode === "ppt"
        ? "Slides"
        : "Pages";

}


/* =========================================================
OPEN DOCUMENT
========================================================= */

function openDocument(){

    document
        .getElementById("mainFile")
        .click();

}


document
.getElementById("mainFile")
.addEventListener(
    "change",
    async function(e){

        const file =
            e.target.files[0];

        if(!file)
            return;

        try{

            const name =
                file.name.toLowerCase();

            if(
                name.endsWith(".pdf")
            ){

                await loadPDF(file);

            }
            else if(
                name.endsWith(".pptx")
            ){

                await loadPPTX(file);

            }
            else{

                alert(
                    "Please select a PDF or PPTX file."
                );

            }

        }
        catch(error){

            console.error(error);

            hideLoading();

            alert(
                "Could not open the file.\n\n"+
                error.message
            );

        }

        e.target.value = "";

    }
);


/* =========================================================
LOAD PDF
========================================================= */

async function loadPDF(file){

    showLoading(
        "Opening PDF..."
    );

    originalPDF =
        new Uint8Array(
            await file.arrayBuffer()
        );


    originalPDFDocument =
        await pdfjsLib
            .getDocument({
                data:originalPDF
            })
            .promise;


    pages = [];


    for(
        let i=1;
        i<=originalPDFDocument.numPages;
        i++
    ){

        pages.push({

            id:
                "pdf-" +
                Date.now() +
                "-" +
                i,

            type:"pdf",

            pageNumber:i,

            rotation:0,

            overlays:[]

        });

    }


    setMode("pdf");

    currentPage = 0;

    undoStack = [];

    redoStack = [];

    pptRenderCache.clear();


    showEditor();


    await renderThumbnails();

    await renderCurrentPage();


    hideLoading();


    showStatus(
        pages.length+
        " PDF page(s) loaded"
    );

}


/* =========================================================
LOAD PPTX
========================================================= */

async function loadPPTX(file){

    showLoading(
        "Reading PowerPoint..."
    );


    const bytes =
        new Uint8Array(
            await file.arrayBuffer()
        );


    originalPPT = bytes;

    pptRenderCache.clear();


    pages =
        await parsePPTX(
            bytes
        );


    if(!pages.length){

        throw new Error(
            "No PowerPoint slides found."
        );

    }


    setMode("ppt");

    currentPage = 0;

    undoStack = [];

    redoStack = [];


    showEditor();


    /*
     * PRE-RENDER EVERY SLIDE.

     * This is intentional.
     * It prevents slides from mixing.
     */

    for(
        let i=0;
        i<pages.length;
        i++
    ){

        showLoading(
            "Rendering slide "+
            (i+1)+
            " of "+
            pages.length+
            "..."
        );


        await renderPPTSnapshot(
            pages[i]
        );

    }


    await renderThumbnails();

    await renderCurrentPage();


    hideLoading();


    showStatus(
        pages.length+
        " PowerPoint slide(s) loaded"
    );

}


/* =========================================================
SHOW EDITOR
========================================================= */

function showEditor(){

    document
        .getElementById("emptyScreen")
        .style.display="none";

    document
        .getElementById("pageWrapper")
        .style.display="block";

}


/* =========================================================
PPTX PARSER
========================================================= */

async function parsePPTX(bytes){

    const zip =
        await JSZip.loadAsync(
            bytes
        );


    const presentationXML =
        await getZipText(
            zip,
            "ppt/presentation.xml"
        );


    const relsXML =
        await getZipText(
            zip,
            "ppt/_rels/presentation.xml.rels"
        );


    /*
     * Read actual slide order from
     * presentation.xml.
     */

    const slideRelationshipIds =
        [
            ...presentationXML.matchAll(
                /<p:sldId[^>]*r:id="([^"]+)"/g
            )
        ]
        .map(
            x=>x[1]
        );


    /*
     * Relationship ID -> slide XML
     */

    const relationMap =
        {};


    const relMatches =
        [
            ...relsXML.matchAll(
                /<Relationship\b[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g
            )
        ];


    relMatches.forEach(
        match=>{

            relationMap[
                match[1]
            ] =
                normalizeTarget(
                    "ppt/",
                    match[2]
                );

        }
    );


    const result = [];


    for(
        let i=0;
        i<slideRelationshipIds.length;
        i++
    ){

        const rid =
            slideRelationshipIds[i];


        const slidePath =
            relationMap[rid];


        if(
            !slidePath ||
            !zip.file(slidePath)
        )
            continue;


        const slideXML =
            await zip
                .file(slidePath)
                .async("text");


        const slideNumber =
            i+1;


        /*
         * Slide relationships
         */

        const relPath =
            slidePath
                .replace(
                    /ppt\/slides\/([^/]+)$/,
                    "ppt/slides/_rels/$1.rels"
                );


        let slideRels = "";


        if(zip.file(relPath)){

            slideRels =
                await zip
                    .file(relPath)
                    .async("text");

        }


        const mediaMap =
            await buildSlideMediaMap(
                zip,
                slideRels,
                slidePath
            );


        const elements =
            parseSlideElements(
                slideXML,
                mediaMap
            );


        result.push({

            id:
                "ppt-" +
                Date.now() +
                "-" +
                slideNumber,

            type:"ppt",

            width:13.333,

            height:7.5,

            rotation:0,

            elements:elements,

            overlays:[]

        });

    }


    return result;

}


/* =========================================================
GET ZIP TEXT
========================================================= */

async function getZipText(
    zip,
    path
){

    const file =
        zip.file(path);

    if(!file)
        return "";

    return await file.async(
        "text"
    );

}


/* =========================================================
NORMALIZE TARGET
========================================================= */

function normalizeTarget(
    base,
    target
){

    target =
        target
            .replace(
                /\\/g,
                "/"
            );


    if(
        target.startsWith("/")
    ){

        return target.substring(1);

    }


    const parts =
        (
            base+
            target
        )
        .split("/");


    const output=[];


    parts.forEach(
        part=>{

            if(
                !part ||
                part==="."
            )
                return;


            if(part===".."){

                output.pop();

            }
            else{

                output.push(part);

            }

        }
    );


    return output.join("/");

}


/* =========================================================
BUILD MEDIA MAP
========================================================= */

async function buildSlideMediaMap(
    zip,
    relXML,
    slidePath
){

    const map = {};


    const matches =
        [
            ...relXML.matchAll(
                /<Relationship\b[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g
            )
        ];


    for(
        const match of matches
    ){

        const rid =
            match[1];

        const target =
            match[2];


        /*
         * Ignore hyperlinks.
         */

        if(
            /hyperlink/i.test(
                match[0]
            )
        )
            continue;


        const slideFolder =
            slidePath.substring(
                0,
                slidePath.lastIndexOf("/")
            )+
            "/";


        let mediaPath =
            normalizeTarget(
                slideFolder,
                target
            );


        if(
            !mediaPath.startsWith(
                "ppt/"
            )
        ){

            mediaPath =
                "ppt/"+
                mediaPath.replace(
                    /^ppt\//,
                    ""
                );

        }


        if(
            zip.file(mediaPath)
        ){

            const blob =
                await zip
                    .file(mediaPath)
                    .async("blob");


            const dataURL =
                await blobToDataURL(
                    blob
                );


            map[rid] =
                dataURL;

        }

    }


    return map;

}


/* =========================================================
PARSE SLIDE ELEMENTS
========================================================= */

function parseSlideElements(
    xml,
    mediaMap
){

    const elements = [];


    /*
     * TEXT SHAPES
     */

    const shapes =
        xml.match(
            /<p:sp\b[\s\S]*?<\/p:sp>/g
        ) || [];


    shapes.forEach(
        shape=>{

            const textParts =
                [
                    ...shape.matchAll(
                        /<a:t>([\s\S]*?)<\/a:t>/g
                    )
                ];


            if(!textParts.length)
                return;


            const text =
                textParts
                    .map(
                        m=>
                        decodeXML(
                            m[1]
                        )
                    )
                    .join("");


            if(!text.trim())
                return;


            const position =
                getShapePosition(
                    shape
                );


            const fontSize =
                getFontSize(
                    shape
                );


            const color =
                getTextColor(
                    shape
                );


            elements.push({

                type:"text",

                text:text,

                x:position.x,

                y:position.y,

                w:position.w,

                h:position.h,

                fontSize:fontSize,

                color:color

            });

        }
    );


    /*
     * PICTURES
     */

    const pictures =
        xml.match(
            /<p:pic\b[\s\S]*?<\/p:pic>/g
        ) || [];


    pictures.forEach(
        picture=>{

            const embed =
                picture.match(
                    /r:embed="([^"]+)"/
                );


            if(!embed)
                return;


            const src =
                mediaMap[
                    embed[1]
                ];


            if(!src)
                return;


            const position =
                getShapePosition(
                    picture
                );


            elements.push({

                type:"image",

                src:src,

                x:position.x,

                y:position.y,

                w:position.w,

                h:position.h

            });

        }
    );


    return elements;

}


/* =========================================================
GET SHAPE POSITION
========================================================= */

function getShapePosition(
    xml
){

    const off =
        xml.match(
            /<a:off\b[^>]*x="(-?\d+)"[^>]*y="(-?\d+)"/
        );


    const ext =
        xml.match(
            /<a:ext\b[^>]*cx="(\d+)"[^>]*cy="(\d+)"/
        );


    let x=1;

    let y=1;

    let w=5;

    let h=1;


    if(off){

        x =
            Number(
                off[1]
            ) /
            914400;

        y =
            Number(
                off[2]
            ) /
            914400;

    }


    if(ext){

        w =
            Number(
                ext[1]
            ) /
            914400;

        h =
            Number(
                ext[2]
            ) /
            914400;

    }


    return {
        x,
        y,
        w,
        h
    };

}


/* =========================================================
GET FONT SIZE
========================================================= */

function getFontSize(
    xml
){

    const match =
        xml.match(
            /<a:rPr\b[^>]*sz="(\d+)"/
        );


    if(!match)
        return 24;


    return (
        Number(
            match[1]
        ) /
        100
    );

}


/* =========================================================
GET TEXT COLOR
========================================================= */

function getTextColor(
    xml
){

    const match =
        xml.match(
            /<a:srgbClr\b[^>]*val="([0-9A-Fa-f]{6})"/
        );


    if(!match)
        return "#000000";


    return "#"+
        match[1];

}


/* =========================================================
DECODE XML
========================================================= */

function decodeXML(text){

    return text
        .replace(
            /&amp;/g,
            "&"
        )
        .replace(
            /&lt;/g,
            "<"
        )
        .replace(
            /&gt;/g,
            ">"
        )
        .replace(
            /&quot;/g,
            '"'
        )
        .replace(
            /&apos;/g,
            "'"
        );

}


/* =========================================================
BLOB -> DATA URL
========================================================= */

function blobToDataURL(
    blob
){

    return new Promise(
        resolve=>{

            const reader =
                new FileReader();

            reader.onload =
                ()=>{
                    resolve(
                        reader.result
                    );
                };

            reader.readAsDataURL(
                blob
            );

        }
    );

}


/* =========================================================
RENDER PPT SNAPSHOT
========================================================= */

/*
IMPORTANT FIX:

This function waits for ALL images to finish loading
before returning.

The previous version used img.onload directly,
which could draw an old slide after the user
had already selected another slide.

This version never does that.
*/

async function renderPPTSnapshot(
    state
){

    const key =
        state.id;


    if(
        pptRenderCache.has(key)
    ){

        return pptRenderCache.get(
            key
        );

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    const WIDTH = 1600;

    const HEIGHT = 900;


    canvas.width = WIDTH;

    canvas.height = HEIGHT;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const scale =
        WIDTH /
        (
            state.width*
            96
        );


    /*
     * First draw ALL images.
     */

    const imagePromises = [];


    for(
        const item of state.elements || []
    ){

        if(
            item.type !== "image"
        )
            continue;


        const image =
            new Image();


        const promise =
            new Promise(
                resolve=>{

                    image.onload =
                        ()=>{
                            resolve({
                                image,
                                item
                            });
                        };


                    image.onerror =
                        ()=>{
                            resolve(null);
                        };


                    image.src =
                        item.src;

                }
            );


        imagePromises.push(
            promise
        );

    }


    const loadedImages =
        await Promise.all(
            imagePromises
        );


    /*
     * Draw images.
     */

    loadedImages.forEach(
        data=>{

            if(!data)
                return;


            const {
                image,
                item
            } = data;


            ctx.drawImage(

                image,

                item.x*
                96*
                scale,

                item.y*
                96*
                scale,

                item.w*
                96*
                scale,

                item.h*
                96*
                scale

            );

        }
    );


    /*
     * Draw text AFTER images.
     */

    for(
        const item of state.elements || []
    ){

        if(
            item.type !== "text"
        )
            continue;


        const x =
            item.x*
            96*
            scale;


        const y =
            item.y*
            96*
            scale;


        const width =
            Math.max(
                100,
                item.w*
                96*
                scale
            );


        const size =
            item.fontSize*
            scale;


        ctx.fillStyle =
            item.color ||
            "#000000";


        ctx.font =
            size+
            "px Arial";


        drawWrappedText(
            ctx,
            item.text,
            x,
            y+size,
            width,
            size*1.25
        );

    }


    /*
     * Create an independent PNG.
     */

    const dataURL =
        canvas.toDataURL(
            "image/png"
        );


    pptRenderCache.set(
        key,
        dataURL
    );


    return dataURL;

}


/* =========================================================
WRAPPED TEXT
========================================================= */

function drawWrappedText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight
){

    const words =
        text.split(/\s+/);


    let line = "";


    for(
        let i=0;
        i<words.length;
        i++
    ){

        const test =
            line+
            words[i]+
            " ";


        const width =
            ctx.measureText(
                test
            ).width;


        if(
            width>maxWidth &&
            line
        ){

            ctx.fillText(
                line,
                x,
                y
            );


            line =
                words[i]+
                " ";


            y +=
                lineHeight;

        }
        else{

            line =
                test;

        }

    }


    if(line){

        ctx.fillText(
            line,
            x,
            y
        );

    }

}


/* =========================================================
THUMBNAILS
========================================================= */

async function renderThumbnails(){

    const container =
        document.getElementById(
            "thumbnails"
        );


    container.innerHTML = "";


    document.getElementById(
        "pageCount"
    ).innerText =
        pages.length;


    for(
        let i=0;
        i<pages.length;
        i++
    ){

        const state =
            pages[i];


        const thumb =
            document.createElement(
                "div"
            );


        thumb.className =
            "thumbnail";


        if(
            i===currentPage
        ){

            thumb.classList.add(
                "active"
            );

        }


        thumb.draggable = true;


        /*
         * Canvas
         */

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            320;

        canvas.height =
            180;


        thumb.appendChild(
            canvas
        );


        /*
         * Label
         */

        const label =
            document.createElement(
                "div"
            );


        label.className =
            "thumb-name";


        label.innerText =
            mode==="ppt"
            ?
            "Slide "+(i+1)
            :
            "Page "+(i+1);


        thumb.appendChild(
            label
        );


        /*
         * Delete
         */

        const del =
            document.createElement(
                "button"
            );


        del.className =
            "thumb-delete";


        del.innerText =
            "×";


        del.onclick =
            function(e){

                e.stopPropagation();

                deletePage(i);

            };


        thumb.appendChild(
            del
        );


        /*
         * Click
         */

        thumb.onclick =
            async function(){

                currentPage =
                    i;

                await renderThumbnails();

                await renderCurrentPage();

            };


        /*
         * Drag reorder
         */

        thumb.addEventListener(
            "dragstart",
            e=>{

                e.dataTransfer.setData(
                    "text/plain",
                    String(i)
                );

                thumb.classList.add(
                    "dragging"
                );

            }
        );


        thumb.addEventListener(
            "dragend",
            ()=>{

                thumb.classList.remove(
                    "dragging"
                );

            }
        );


        thumb.addEventListener(
            "dragover",
            e=>{

                e.preventDefault();

                thumb.classList.add(
                    "dragover"
                );

            }
        );


        thumb.addEventListener(
            "dragleave",
            ()=>{

                thumb.classList.remove(
                    "dragover"
                );

            }
        );


        thumb.addEventListener(
            "drop",
            async e=>{

                e.preventDefault();

                thumb.classList.remove(
                    "dragover"
                );


                const from =
                    Number(
                        e.dataTransfer.getData(
                            "text/plain"
                        )
                    );


                const to =
                    i;


                if(
                    from===to
                )
                    return;


                saveState();


                const moved =
                    pages.splice(
                        from,
                        1
                    )[0];


                pages.splice(
                    to,
                    0,
                    moved
                );


                currentPage =
                    to;


                await renderThumbnails();

                await renderCurrentPage();


                showStatus(
                    "Pages/slides reordered"
                );

            }
        );


        container.appendChild(
            thumb
        );


        await drawThumbnail(
            canvas,
            state
        );

    }

}


/* =========================================================
DRAW THUMBNAIL
========================================================= */

async function drawThumbnail(
    canvas,
    state
){

    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * PPT
     */

    if(
        state.type==="ppt"
    ){

        const dataURL =
            await renderPPTSnapshot(
                state
            );


        const img =
            await loadImage(
                dataURL
            );


        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        return;

    }


    /*
     * IMAGE PAGE
     */

    if(
        state.type==="imagePage"
    ){

        const img =
            await loadImage(
                state.src
            );


        drawContain(
            ctx,
            img,
            canvas.width,
            canvas.height
        );


        return;

    }


    /*
     * BLANK
     */

    if(
        state.type==="blank"
    ){

        ctx.strokeStyle =
            "#ddd";


        ctx.strokeRect(
            1,
            1,
            canvas.width-2,
            canvas.height-2
        );


        return;

    }


    /*
     * PDF
     */

    if(
        state.type==="pdf"
    ){

        const page =
            await originalPDFDocument
                .getPage(
                    state.pageNumber
                );


        const viewport =
            page.getViewport({
                scale:.25
            });


        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:ctx,

            viewport:viewport

        }).promise;

    }

}


/* =========================================================
LOAD IMAGE
========================================================= */

function loadImage(
    src
){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.onload =
                ()=>{
                    resolve(img);
                };


            img.onerror =
                reject;


            img.src =
                src;

        }
    );

}


/* =========================================================
DRAW CONTAIN
========================================================= */

function drawContain(
    ctx,
    img,
    width,
    height
){

    const scale =
        Math.min(
            width/img.width,
            height/img.height
        );


    const w =
        img.width*
        scale;


    const h =
        img.height*
        scale;


    ctx.drawImage(
        img,
        (width-w)/2,
        (height-h)/2,
        w,
        h
    );

}


/* =========================================================
RENDER CURRENT PAGE
========================================================= */

async function renderCurrentPage(){

    if(
        !pages.length
    )
        return;


    const state =
        pages[currentPage];


    if(!state)
        return;


    /*
     * Every rendering operation works
     * with this exact state object.
     */

    if(
        state.type==="pdf"
    ){

        await renderPDFPage(
            state
        );

    }
    else if(
        state.type==="ppt"
    ){

        await renderPPTPage(
            state
        );

    }
    else if(
        state.type==="blank"
    ){

        renderBlankPage(
            state
        );

    }
    else if(
        state.type==="imagePage"
    ){

        await renderImagePage(
            state
        );

    }

}


/* =========================================================
RENDER PDF PAGE
========================================================= */

async function renderPDFPage(
    state
){

    const page =
        await originalPDFDocument
            .getPage(
                state.pageNumber
            );


    const viewport =
        page.getViewport({

            scale:zoom,

            rotation:
                state.rotation

        });


    const canvas =
        document.getElementById(
            "mainCanvas"
        );


    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;


    await page.render({

        canvasContext:
            canvas.getContext("2d"),

        viewport:viewport

    }).promise;


    setWrapper(
        viewport.width,
        viewport.height
    );


    removeOverlays();

    renderOverlays();

}


/* =========================================================
RENDER PPT PAGE
========================================================= */

async function renderPPTPage(
    state
){

    /*
     * Get ONLY this slide's snapshot.
     */

    const dataURL =
        await renderPPTSnapshot(
            state
        );


    const img =
        await loadImage(
            dataURL
        );


    const canvas =
        document.getElementById(
            "mainCanvas"
        );


    const width =
        state.width*
        96*
        zoom;


    const height =
        state.height*
        96*
        zoom;


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    setWrapper(
        width,
        height
    );


    removeOverlays();

    renderOverlays();

}


/* =========================================================
BLANK PAGE
========================================================= */

function renderBlankPage(
    state
){

    let width =
        state.width*
        zoom;


    let height =
        state.height*
        zoom;


    if(
        state.rotation===90 ||
        state.rotation===270
    ){

        [width,height] =
            [height,width];

    }


    const canvas =
        document.getElementById(
            "mainCanvas"
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    setWrapper(
        width,
        height
    );


    removeOverlays();

    renderOverlays();

}


/* =========================================================
IMAGE PAGE
========================================================= */

async function renderImagePage(
    state
){

    const img =
        await loadImage(
            state.src
        );


    let width =
        img.width*
        zoom;


    let height =
        img.height*
        zoom;


    if(
        state.rotation===90 ||
        state.rotation===270
    ){

        [width,height] =
            [height,width];

    }


    const canvas =
        document.getElementById(
            "mainCanvas"
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.save();


    if(
        state.rotation===90
    ){

        ctx.translate(
            width,
            0
        );

        ctx.rotate(
            Math.PI/2
        );

    }
    else if(
        state.rotation===180
    ){

        ctx.translate(
            width,
            height
        );

        ctx.rotate(
            Math.PI
        );

    }
    else if(
        state.rotation===270
    ){

        ctx.translate(
            0,
            height
        );

        ctx.rotate(
            -Math.PI/2
        );

    }


    ctx.drawImage(
        img,
        0,
        0,
        img.width*zoom,
        img.height*zoom
    );


    ctx.restore();


    setWrapper(
        width,
        height
    );


    removeOverlays();

    renderOverlays();

}


/* =========================================================
SET WRAPPER
========================================================= */

function setWrapper(
    width,
    height
){

    const wrapper =
        document.getElementById(
            "pageWrapper"
        );


    wrapper.style.width =
        width+"px";


    wrapper.style.height =
        height+"px";

}


/* =========================================================
REMOVE OVERLAYS
========================================================= */

function removeOverlays(){

    document
        .querySelectorAll(
            ".overlay"
        )
        .forEach(
            el=>el.remove()
        );

}


/* =========================================================
RENDER OVERLAYS
========================================================= */

function renderOverlays(){

    const state =
        pages[currentPage];


    if(!state)
        return;


    if(!state.overlays)
        state.overlays=[];


    state.overlays.forEach(
        (item,index)=>{

            let element;


            /*
             * TEXT
             */

            if(
                item.type==="text"
            ){

                element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "overlay overlay-text";


                element.innerText =
                    item.text;


                element.style.fontSize =
                    item.size+"px";


                element.style.color =
                    item.color;


                element.style.opacity =
                    item.opacity ??
                    1;

            }


            /*
             * WATERMARK
             */

            else if(
                item.type==="watermark"
            ){

                element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "overlay overlay-watermark";


                element.innerText =
                    item.text;


                element.style.fontSize =
                    item.size+"px";


                element.style.color =
                    item.color;


                element.style.opacity =
                    item.opacity;

            }


            /*
             * IMAGE
             */

            else if(
                item.type==="image"
            ){

                element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "overlay overlay-image";


                element.style.width =
                    item.width+"px";


                element.style.height =
                    item.height+"px";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    item.src;


                element.appendChild(
                    img
                );

            }


            if(!element)
                return;


            element.style.left =
                item.x+"px";


            element.style.top =
                item.y+"px";


            element.dataset.index =
                index;


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "overlay-delete";


            deleteButton.innerText =
                "×";


            deleteButton.onclick =
                e=>{

                    e.stopPropagation();

                    saveState();


                    state.overlays.splice(
                        index,
                        1
                    );


                    renderCurrentPage();

                };


            element.appendChild(
                deleteButton
            );


            makeOverlayDraggable(
                element
            );


            element.onclick =
                e=>{

                    e.stopPropagation();


                    document
                        .querySelectorAll(
                            ".overlay"
                        )
                        .forEach(
                            x=>
                            x.classList.remove(
                                "selected"
                            )
                        );

/* =========================================================
DRAG OVERLAY
========================================================= */

function makeOverlayDraggable(
    element
){

    element.addEventListener(
        "mousedown",
        function(e){

            if(
                e.target.classList.contains(
                    "overlay-delete"
                )
            )
                return;


            e.preventDefault();


            const startX =
                e.clientX;


            const startY =
                e.clientY;


            const startLeft =
                parseFloat(
                    element.style.left
                ) || 0;


            const startTop =
                parseFloat(
                    element.style.top
                ) || 0;


            const index =
                Number(
                    element.dataset.index
                );


            const move =
                ev=>{

                    element.style.left =
                        Math.max(
                            0,
                            startLeft+
                            ev.clientX-
                            startX
                        )+
                        "px";


                    element.style.top =
                        Math.max(
                            0,
                            startTop+
                            ev.clientY-
                            startY
                        )+
                        "px";

                };


            const stop =
                ()=>{

                    document.removeEventListener(
                        "mousemove",
                        move
                    );


                    document.removeEventListener(
                        "mouseup",
                        stop
                    );


                    const state =
                        pages[currentPage];


                    if(
                        state &&
                        state.overlays[index]
                    ){

                        state.overlays[index].x =
                            parseFloat(
                                element.style.left
                            );


                        state.overlays[index].y =
                            parseFloat(
                                element.style.top
                            );

                    }

                };


            document.addEventListener(
                "mousemove",
                move
            );


            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );

}

                        "imported-pdf-"+Date.now()+"-"+i,

                    type:"imagePage",

                    src:
                        canvas.toDataURL(
                            "image/png"
                        ),

                    width:
                        viewport.width,

                    height:
                        viewport.height,

                    rotation:0,

                    overlays:[]

                });

            pages.splice(

                currentPage+1,

                0,

                ...added

            currentPage++;


            await renderThumbnails();

            await renderCurrentPage();


            hideLoading();


            showStatus(
                added.length+

function deletePage(
    index
){

    if(
        pages.length<=1
    ){

        alert(
            "At least one page/slide is required."
        );

        return;

    }


    saveState();


    const removed =
        pages[index];


    if(
        removed &&
        removed.id
    ){

        pptRenderCache.delete(
            removed.id
        );

    }


    pages.splice(
        index,
        1
    );


    if(
        currentPage>=pages.length

    renderThumbnails();

    showStatus(
        mode==="ppt"

        undoStack.shift();

    }


    redoStack=[];

        showStatus(

    currentPage =
        Math.min(
            currentPage,

/* =========================================================
EXPORT PDF
========================================================= */

async function exportPDF(){

    showLoading(
        "Creating PDF..."
    );


    const output =
        await PDFLib
            .PDFDocument
            .create();


    const font =
        await output.embedFont(
            PDFLib.StandardFonts.Helvetica
        );


    for(
        const state of pages
    ){

        let page = null;


        /*
         * ORIGINAL PDF PAGE
         */

        if(
            state.type==="pdf"
        ){

            const copied =
                await output
                    .copyPages(
                        originalPDFDocument,
                        [
                            state.pageNumber-1
                        ]
                    );


            page =
                copied[0];


            output.addPage(
                page
            );


            if(
                state.rotation
            ){

                page.setRotation(
                    PDFLib.degrees(
                        state.rotation
                    )
                );

            }

        }


        /*
         * BLANK
         */

        else if(
            state.type==="blank"
        ){

            let w =
                state.width;


            let h =
                state.height;


            if(
                state.rotation===90 ||
                state.rotation===270
            ){

                [w,h] =
                    [h,w];

            }


            page =
                output.addPage([
                    w,
                    h
                ]);

        }


        /*
         * IMAGE PAGE
         */

        else if(
            state.type==="imagePage"
        ){

            const image =
                await output.embedPng(
                    state.src
                );


            const maxW =
                595;


            const maxH =
                842;


            const scale =
                Math.min(
                    maxW/image.width,
                    maxH/image.height,
                    1
                );


            const w =
                image.width*
                scale;


            const h =
                image.height*
                scale;


            page =
                output.addPage([
                    w,
                    h
                ]);


            page.drawImage(
                image,
                {
                    x:0,
                    y:0,
                    width:w,
                    height:h
                }
            );

        }


        /*
         * PPT SLIDE IN PDF
         */

        else if(
            state.type==="ppt"
        ){

            const snapshot =
                await renderPPTSnapshot(
                    state
                );


            const image =
                await output.embedPng(
                    snapshot
                );


            page =
                output.addPage([
                    960,
                    540
                ]);


            page.drawImage(
                image,
                {
                    x:0,
                    y:0,
                    width:960,
                    height:540
                }
            );

        }


        if(!page)
            continue;


        await drawPDFOverlays(
            page,
            state,
            output,
            font
        );

    }


    const bytes =
        await output.save();


    downloadBlob(
        new Blob(
            [bytes],
            {
                type:
                    "application/pdf"
            }
        ),
        "edited-document.pdf"
    );


    hideLoading();


    showStatus(
        "PDF downloaded"
    );

}


/* =========================================================
DRAW PDF OVERLAYS
========================================================= */

async function drawPDFOverlays(
    page,
    state,
    output,
    font
){

    if(
        !state.overlays
    )
        return;


    const size =
        page.getSize();


    for(
        const item of state.overlays
    ){

        if(
            item.type==="text" ||
            item.type==="watermark"
        ){

            const rgb =
                hexToRGB(
                    item.color
                );


            page.drawText(
                item.text,
                {

                    x:
                        item.x/
                        zoom,

                    y:
                        size.height-
                        (
                            item.y+
                            item.size
                        )/
                        zoom,

                    size:
                        item.size/
                        zoom,

                    font:font,

                    color:
                        PDFLib.rgb(
                            rgb.r,
                            rgb.g,
                            rgb.b
                        ),

                    opacity:
                        item.opacity

                }
            );

        }


        if(
            item.type==="image"
        ){

            let image;


            if(
                item.src.startsWith(
                    "data:image/png"
                )
            ){

                image =
                    await output.embedPng(
                        item.src
                    );

            }
            else{

                image =
                    await output.embedJpg(
                        item.src
                    );

            }


            page.drawImage(
                image,
                {

                    x:
                        item.x/
                        zoom,

                    y:
                        size.height-
                        (
                            item.y+
                            item.height
                        )/
                        zoom,

                    width:
                        item.width/
                        zoom,

                    height:
                        item.height/
                        zoom

                }
            );

        }

    }

}


/* =========================================================
EXPORT PPTX
========================================================= */

async function exportPPTX(){

    showLoading(
        "Creating PowerPoint..."
    );


    /*
     * IMPORTANT:
     * We create each slide independently.
     */

    const pptx =
        new PptxGenJS();


    pptx.layout =
        "LAYOUT_WIDE";


    pptx.author =
        "PDF & PPT Editor";


    pptx.subject =
        "Edited Presentation";


    pptx.title =
        "Edited Presentation";


    for(
        let i=0;
        i<pages.length;
        i++
    ){

        const state =
            pages[i];


        showLoading(
            "Creating slide "+
            (i+1)+
            " of "+
            pages.length+
            "..."
        );


        const slide =
            pptx.addSlide();


        slide.background = {
            color:"FFFFFF"
        };


        /*
         * EXISTING PPT SLIDE
         */

        if(
            state.type==="ppt"
        ){

            const snapshot =
                await renderPPTSnapshot(
                    state
                );


            /*
             * Put the COMPLETE slide into
             * THIS slide only.
             */

            slide.addImage({

                data:
                    snapshot,

                x:0,

                y:0,

                w:13.333,

                h:7.5

            });

        }


        /*
         * IMAGE PAGE
         */

        else if(
            state.type==="imagePage"
        ){

            slide.addImage({

                data:
                    state.src,

                x:0,

                y:0,

                w:13.333,

                h:7.5

            });

        }


        /*
         * PDF PAGE
         */

        else if(
            state.type==="pdf"
        ){

            const pdfPage =
                await originalPDFDocument
                    .getPage(
                        state.pageNumber
                    );


            const viewport =
                pdfPage.getViewport({
                    scale:1
                });


            const canvas =
                document.createElement(
                    "canvas"
                );


            const scale =
                Math.min(
                    1600/viewport.width,
                    900/viewport.height
                );


            const finalViewport =
                pdfPage.getViewport({
                    scale:scale
                });


            canvas.width =
                finalViewport.width;


            canvas.height =
                finalViewport.height;


            await pdfPage.render({

                canvasContext:
                    canvas.getContext("2d"),

                viewport:
                    finalViewport

            }).promise;


            slide.addImage({

                data:
                    canvas.toDataURL(
                        "image/png"
                    ),

                x:0,

                y:0,

                w:13.333,

                h:7.5

            });

        }


        /*
         * OVERLAYS
         */

        await addPPTOverlays(
            slide,
            state
        );

    }


    await pptx.writeFile({

        fileName:
            "edited-presentation.pptx"

    });


    hideLoading();


    showStatus(
        "PowerPoint downloaded"
    );

}


/* =========================================================
ADD PPT OVERLAYS
========================================================= */

async function addPPTOverlays(
    slide,
    state
){

    if(
        !state.overlays
    )
        return;


    for(
        const item of state.overlays
    ){

        /*
         * TEXT
         */

        if(
            item.type==="text" ||
            item.type==="watermark"
        ){

            slide.addText(
                item.text,
                {

                    x:
                        item.x/
                        (
                            96*
                            zoom
                        ),

                    y:
                        item.y/
                        (
                            96*
                            zoom
                        ),

                    w:4,

                    h:1,

                    fontSize:
                        item.size,

                    color:
                        item.color
                            .replace(
                                "#",
                                ""
                            ),

                    transparency:
                        Math.round(
                            (
                                1-
                                item.opacity
                            )*
                            100
                        ),

                    margin:.02

                }
            );

        }


        /*
         * IMAGE
         */

        if(
            item.type==="image"
        ){

            slide.addImage({

                data:
                    item.src,

                x:
                    item.x/
                    (
                        96*
                        zoom
                    ),

                y:
                    item.y/
                    (
                        96*
                        zoom
                    ),

                w:
                    item.width/
                    (
                        96*
                        zoom
                    ),

                h:
                    item.height/
                    (
                        96*
                        zoom
                    )

            });

        }

    }

}


/* =========================================================
HEX TO RGB
========================================================= */

function hexToRGB(
    hex
){

    hex =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(
                    0,
                    2
                ),
                16
            )/255,

        g:
            parseInt(
                hex.substring(
                    2,
                    4
                ),
                16
            )/255,

        b:
            parseInt(
                hex.substring(
                    4,
                    6
                ),
                16
            )/255

    };

}


/* =========================================================
DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        1000
    );

}


/* =========================================================
KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        /*
         * Undo
         */

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

            return;

        }


        /*
         * Redo
         */

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

            return;

        }


        /*
         * Previous
         */

        if(
            e.key==="ArrowLeft" &&
            !e.ctrlKey &&
            !e.shiftKey
        ){

            previousPage();

        }


        /*
         * Next
         */

        if(
            e.key==="ArrowRight" &&
            !e.ctrlKey &&
            !e.shiftKey
        ){

            nextPage();

        }


        /*
         * Delete selected overlay
         */

        if(
            e.key==="Delete"
        ){

            const selected =
                document.querySelector(
                    ".overlay.selected"
                );


            if(selected){

                const index =
                    Number(
                        selected.dataset.index
                    );


                saveState();


                pages[currentPage]
                    .overlays
                    .splice(
                        index,
                        1
                    );


                renderCurrentPage();

            }

        }

    }
);


/* =========================================================
CLICK OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function(e){

        if(
            !e.target.closest(
                "#addMenu"
            ) &&
            !e.target.closest(
                ".blue"
            )
        ){

            closeAddMenu();

        }


        if(
            !e.target.closest(
                ".overlay"
            )
        ){

            document
                .querySelectorAll(
                    ".overlay"
                )
                .forEach(
                    x=>
                    x.classList.remove(
                        "selected"
                    )
                );

        }

    }
);
