 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f5;
    color:#222;
}

header{
    height:65px;
    background:#20252b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#4da3ff;
}

.headerButtons{
    display:flex;
    gap:8px;
}

button{
    border:none;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    opacity:.85;
}

.primary{
    background:#1976d2;
    color:white;
}

.green{
    background:#159447;
    color:white;
}

.red{
    background:#d93025;
    color:white;
}

.gray{
    background:#444;
    color:white;
}

.workspace{
    display:flex;
    height:calc(100vh - 65px);
}

/* LEFT SIDEBAR */

.sidebar{
    width:260px;
    background:#fff;
    border-right:1px solid #ddd;
    overflow:auto;
    padding:15px;
}

.sidebar h3{
    margin-top:5px;
    margin-bottom:12px;
}

.tool{
    width:100%;
    margin-bottom:8px;
    text-align:left;
    background:#f2f4f7;
    border:1px solid #ddd;
}

.tool:hover{
    background:#e4e9ef;
}

.section{
    border-top:1px solid #ddd;
    margin-top:15px;
    padding-top:15px;
}

input,select{
    width:100%;
    padding:9px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:8px;
}

/* THUMBNAILS */

.pages{
    width:190px;
    background:#f7f7f7;
    border-right:1px solid #ddd;
    overflow:auto;
    padding:12px;
}

.thumbnail{
    background:white;
    border:2px solid transparent;
    margin-bottom:12px;
    padding:5px;
    cursor:pointer;
    position:relative;
}

.thumbnail.active{
    border-color:#1976d2;
}

.thumbnail canvas{
    width:100%;
    display:block;
}

.pageLabel{
    text-align:center;
    padding:5px;
    font-size:12px;
}

.deletePage{
    position:absolute;
    right:4px;
    top:4px;
    background:#d93025;
    color:white;
    padding:3px 6px;
    border-radius:4px;
    font-size:11px;
}

/* CANVAS AREA */

.editorArea{
    flex:1;
    overflow:auto;
    background:#cfd4da;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:30px;
}

.pageWrapper{
    position:relative;
    background:white;
    box-shadow:0 3px 15px rgba(0,0,0,.25);
}

#pdfCanvas{
    display:block;
}

.overlay{
    position:absolute;
    cursor:move;
    user-select:none;
    border:1px dashed transparent;
}

.overlay:hover{
    border-color:#1976d2;
}

.textOverlay{
    padding:4px;
    white-space:nowrap;
    font-weight:normal;
}

.imageOverlay img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* STATUS */

.status{
    position:fixed;
    bottom:15px;
    right:20px;
    background:#20252b;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    display:none;
}

/* MOBILE */

@media(max-width:900px){
    .sidebar{
        width:200px;
    }

    .pages{
        width:130px;
    }
}

@media(max-width:650px){
    .pages{
        display:none;
    }

    .sidebar{
        width:170px;
    }

    .headerButtons button{
        padding:7px;
    }

    .logo{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
    <span>PDF</span> EDITOR
</div>

<div class="headerButtons">
    <button class="gray" onclick="openPDF()">📄 Open PDF</button>
    <button class="green" onclick="downloadPDF()">⬇ Download PDF</button>
</div>

</header>

<div class="workspace">

<!-- LEFT TOOLS -->

<div class="sidebar">

<h3>Tools</h3>

<button class="tool" onclick="addText()">✏️ Add Text</button>

<button class="tool" onclick="addWatermark()">💧 Add Watermark</button>

<button class="tool" onclick="chooseImage()">🖼️ Add Photo</button>

<button class="tool" onclick="addPageNumber()">🔢 Page Number</button>

<button class="tool" onclick="rotatePage()">🔄 Rotate Page</button>

<button class="tool" onclick="addBlankPage()">➕ Add Blank Page</button>

<div class="section">

<h3>Page</h3>

<button class="tool" onclick="previousPage()">⬅ Previous</button>

<button class="tool" onclick="nextPage()">Next ➡</button>

<button class="tool red" onclick="deleteCurrentPage()">🗑️ Delete Page</button>

</div>

<div class="section">

<h3>Text Settings</h3>

<label>Text</label>
<input id="textInput" placeholder="Type text">

<label>Font Size</label>
<input id="fontSize" type="number" value="24">

<label>Text Color</label>
<input id="textColor" type="color" value="#000000">

</div>

<div class="section">

<h3>Watermark</h3>

<input id="watermarkInput" placeholder="Watermark text">

<label>Opacity</label>
<input id="watermarkOpacity"
       type="range"
       min="0.05"
       max="1"
       step="0.05"
       value="0.3">

<label>Watermark Size</label>
<input id="watermarkSize" type="number" value="50">

</div>

<div class="section">

<h3>Zoom</h3>

<button class="tool" onclick="zoomOut()">➖ Zoom Out</button>

<button class="tool" onclick="zoomIn()">➕ Zoom In</button>

</div>

<div class="section">

<button class="tool" onclick="clearOverlays()">🧹 Clear Added Items</button>

<button class="tool" onclick="resetEditor()">♻ Reset</button>

</div>

<input id="pdfInput"
       type="file"
       accept="application/pdf"
       hidden
       onchange="loadPDF(event)">

<input id="imageInput"
       type="file"
       accept="image/*"
       hidden
       onchange="loadImage(event)">

</div>

<!-- PAGE THUMBNAILS -->

<div class="pages" id="pages"></div>

<!-- EDITOR -->

<div class="editorArea" id="editorArea">

<div id="pageWrapper" class="pageWrapper">

<canvas id="pdfCanvas"></canvas>

</div>

</div>

</div>

<div id="status" class="status"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDocument = null;

let currentPage = 1;

let zoom = 1.25;

let pageStates = [];

let draggedElement = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* ---------------- STATUS ---------------- */

function status(message){

    const s = document.getElementById("status");

    s.innerText = message;

    s.style.display = "block";

    setTimeout(()=>{
        s.style.display="none";
    },2500);
}


/* ---------------- OPEN PDF ---------------- */

function openPDF(){

    document.getElementById("pdfInput").click();

}


async function loadPDF(event){

    const file = event.target.files[0];

    if(!file) return;

    const arrayBuffer = await file.arrayBuffer();

    pdfDocument = await pdfjsLib.getDocument({
        data:arrayBuffer
    }).promise;

    pageStates = [];

    for(let i=0;i<pdfDocument.numPages;i++){

        pageStates.push({
            rotation:0,
            overlays:[]
        });

    }

    currentPage=1;

    await renderThumbnails();

    await renderPage();

    status("PDF loaded successfully");

}


/* ---------------- RENDER PAGE ---------------- */

async function renderPage(){

    if(!pdfDocument) return;

    const page =
        await pdfDocument.getPage(currentPage);

    const viewport =
        page.getViewport({
            scale:zoom,
            rotation:pageStates[currentPage-1].rotation
        });

    const canvas =
        document.getElementById("pdfCanvas");

    const ctx =
        canvas.getContext("2d");

    canvas.width=viewport.width;
    canvas.height=viewport.height;

    await page.render({
        canvasContext:ctx,
        viewport:viewport
    }).promise;

    const wrapper =
        document.getElementById("pageWrapper");

    wrapper.style.width =
        viewport.width+"px";

    wrapper.style.height =
        viewport.height+"px";

    removeOverlayElements();

    renderOverlays();

    updateActiveThumbnail();

}


/* ---------------- THUMBNAILS ---------------- */

async function renderThumbnails(){

    const container =
        document.getElementById("pages");

    container.innerHTML="";

    for(let i=1;i<=pdfDocument.numPages;i++){

        const page =
            await pdfDocument.getPage(i);

        const viewport =
            page.getViewport({
                scale:.25
            });

        const div =
            document.createElement("div");

        div.className="thumbnail";

        div.dataset.page=i;

        const canvas =
            document.createElement("canvas");

        canvas.width=viewport.width;

        canvas.height=viewport.height;

        await page.render({
            canvasContext:
                canvas.getContext("2d"),
            viewport:viewport
        }).promise;

        const label =
            document.createElement("div");

        label.className="pageLabel";

        label.innerText="Page "+i;

        const del =
            document.createElement("button");

        del.className="deletePage";

        del.innerText="×";

        del.onclick=(e)=>{

            e.stopPropagation();

            deletePage(i);

        };

        div.onclick=()=>{

            currentPage=i;

            renderPage();

        };

        div.appendChild(canvas);

        div.appendChild(label);

        div.appendChild(del);

        container.appendChild(div);

    }

    updateActiveThumbnail();

}


/* ---------------- ACTIVE THUMBNAIL ---------------- */

function updateActiveThumbnail(){

    document
    .querySelectorAll(".thumbnail")
    .forEach(x=>{

        x.classList.remove("active");

        if(Number(x.dataset.page)===currentPage)
            x.classList.add("active");

    });

}


/* ---------------- NAVIGATION ---------------- */

function nextPage(){

    if(!pdfDocument) return;

    if(currentPage<pdfDocument.numPages){

        currentPage++;

        renderPage();

    }

}


function previousPage(){

    if(!pdfDocument) return;

    if(currentPage>1){

        currentPage--;

        renderPage();

    }

}


/* ---------------- DELETE PAGE ---------------- */

function deleteCurrentPage(){

    if(!pdfDocument) return;

    deletePage(currentPage);

}


function deletePage(pageNumber){

    if(pdfDocument.numPages<=1){

        status("At least one page is required");

        return;

    }

    pageStates.splice(pageNumber-1,1);

    createBlankPDFFromStates();

}


/* ---------------- BLANK PAGE ---------------- */

function addBlankPage(){

    pageStates.push({
        rotation:0,
        overlays:[]
    });

    createBlankPDFFromStates();

}


async function createBlankPDFFromStates(){

    /*
    Recreate a temporary PDF containing
    the existing pages.

    The final export rebuilds everything.
    */

    if(pageStates.length===0) return;

    const container =
        document.getElementById("pages");

    container.innerHTML="";

    currentPage =
        Math.min(currentPage,pageStates.length);

    await renderPageCountOnly();

    status("Page structure updated");

}


async function renderPageCountOnly(){

    const container =
        document.getElementById("pages");

    container.innerHTML="";

    for(let i=1;i<=pageStates.length;i++){

        const div =
            document.createElement("div");

        div.className="thumbnail";

        div.dataset.page=i;

        div.style.height="150px";

        div.style.display="flex";

        div.style.alignItems="center";

        div.style.justifyContent="center";

        div.style.flexDirection="column";

        div.innerHTML=
            "📄<br>Page "+i;

        div.onclick=()=>{

            currentPage=i;

            renderPage();

        };

        container.appendChild(div);

    }

    updateActiveThumbnail();

    renderCurrentExistingPage();

}


async function renderCurrentExistingPage(){

    if(currentPage<=pdfDocument.numPages){

        await renderPage();

    }else{

        renderBlankPage();

    }

}


/* ---------------- BLANK PAGE RENDER ---------------- */

function renderBlankPage(){

    const canvas =
        document.getElementById("pdfCanvas");

    const wrapper =
        document.getElementById("pageWrapper");

    canvas.width=600;

    canvas.height=800;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="white";

    ctx.fillRect(0,0,600,800);

    wrapper.style.width="600px";

    wrapper.style.height="800px";

    removeOverlayElements();

    renderOverlays();

}


/* ---------------- OVERLAYS ---------------- */

function removeOverlayElements(){

    document
    .querySelectorAll(".overlay")
    .forEach(e=>e.remove());

}


function renderOverlays(){

    const state =
        pageStates[currentPage-1];

    if(!state) return;

    state.overlays.forEach((item,index)=>{

        let el;

        if(item.type==="text" ||
           item.type==="watermark"){

            el=document.createElement("div");

            el.className="overlay textOverlay";

            el.innerText=item.text;

            el.style.fontSize=item.size+"px";

            el.style.color=item.color;

            el.style.opacity=item.opacity;

        }

        if(item.type==="image"){

            el=document.createElement("div");

            el.className="overlay imageOverlay";

            el.style.width=item.width+"px";

            el.style.height=item.height+"px";

            const img=document.createElement("img");

            img.src=item.src;

            el.appendChild(img);

        }

        el.style.left=item.x+"px";

        el.style.top=item.y+"px";

        el.dataset.index=index;

        makeDraggable(el);

        document
        .getElementById("pageWrapper")
        .appendChild(el);

    });

}


/* ---------------- DRAGGING ---------------- */

function makeDraggable(element){

    element.addEventListener("mousedown",function(e){

        draggedElement=element;

        const rect=
            element.getBoundingClientRect();

        dragOffsetX=
            e.clientX-rect.left;

        dragOffsetY=
            e.clientY-rect.top;

        function move(ev){

            if(!draggedElement) return;

            const wrapper =
                document
                .getElementById("pageWrapper")
                .getBoundingClientRect();

            let x=
                ev.clientX-wrapper.left-dragOffsetX;

            let y=
                ev.clientY-wrapper.top-dragOffsetY;

            x=Math.max(0,x);

            y=Math.max(0,y);

            element.style.left=x+"px";

            element.style.top=y+"px";

        }

        function up(){

            if(draggedElement){

                const index=
                    Number(draggedElement.dataset.index);

                const state=
                    pageStates[currentPage-1];

                if(state && state.overlays[index]){

                    state.overlays[index].x=
                        parseFloat(draggedElement.style.left);

                    state.overlays[index].y=
                        parseFloat(draggedElement.style.top);

                }

            }

            draggedElement=null;

            document.removeEventListener(
                "mousemove",move);

            document.removeEventListener(
                "mouseup",up);

        }

        document.addEventListener(
            "mousemove",move);

        document.addEventListener(
            "mouseup",up);

    });

}


/* ---------------- ADD TEXT ---------------- */

function addText(){

    if(!pdfDocument) return;

    const text=
        document.getElementById("textInput").value ||
        prompt("Enter text");

    if(!text) return;

    const size=
        Number(document.getElementById("fontSize").value)||24;

    const color=
        document.getElementById("textColor").value;

    pageStates[currentPage-1].overlays.push({

        type:"text",

        text:text,

        x:50,

        y:50,

        size:size,

        color:color,

        opacity:1

    });

    renderPage();

}


/* ---------------- WATERMARK ---------------- */

function addWatermark(){

    if(!pdfDocument) return;

    const text=
        document.getElementById("watermarkInput").value ||
        prompt("Enter watermark");

    if(!text) return;

    const size=
        Number(
            document.getElementById("watermarkSize").value
        )||50;

    const opacity=
        Number(
            document.getElementById("watermarkOpacity").value
        );

    pageStates[currentPage-1].overlays.push({

        type:"watermark",

        text:text,

        x:100,

        y:300,

        size:size,

        color:"#555555",

        opacity:opacity

    });

    renderPage();

}


/* ---------------- ADD IMAGE ---------------- */

function chooseImage(){

    document.getElementById("imageInput").click();

}


function loadImage(event){

    const file=event.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

        pageStates[currentPage-1].overlays.push({

            type:"image",

            src:e.target.result,

            x:50,

            y:50,

            width:200,

            height:150

        });

        renderPage();

    };

    reader.readAsDataURL(file);

}


/* ---------------- PAGE NUMBER ---------------- */

function addPageNumber(){

    if(!pdfDocument) return;

    pageStates.forEach((state,index)=>{

        state.overlays.push({

            type:"text",

            text:String(index+1),

            x:280,

            y:750,

            size:18,

            color:"#000000",

            opacity:1

        });

    });

    renderPage();

}


/* ---------------- ROTATE ---------------- */

function rotatePage(){

    if(!pdfDocument) return;

    const state=
        pageStates[currentPage-1];

    state.rotation=
        (state.rotation+90)%360;

    renderPage();

}


/* ---------------- ZOOM ---------------- */

function zoomIn(){

    zoom+=.15;

    renderPage();

}


function zoomOut(){

    zoom=Math.max(.5,zoom-.15);

    renderPage();

}


/* ---------------- CLEAR ---------------- */

function clearOverlays(){

    if(!pdfDocument) return;

    pageStates[currentPage-1].overlays=[];

    renderPage();

}


/* ---------------- RESET ---------------- */

function resetEditor(){

    location.reload();

}


/* ---------------- DOWNLOAD ---------------- */

async function downloadPDF(){

    if(!pdfDocument){

        alert("Please open a PDF first.");

        return;

    }

    status("Creating PDF...");

    try{

        const sourceBytes =
            await getCurrentPDFBytes();

        const sourcePDF =
            await PDFLib.PDFDocument.load(sourceBytes);

        const finalPDF =
            await PDFLib.PDFDocument.create();

        const helvetica =
            await finalPDF.embedFont(
                PDFLib.StandardFonts.Helvetica
            );

        const pagesToCopy =
            Math.min(
                sourcePDF.getPageCount(),
                pageStates.length
            );

        for(let i=0;i<pagesToCopy;i++){

            const [page] =
                await finalPDF.copyPages(
                    sourcePDF,[i]
                );

            finalPDF.addPage(page);

            const finalPage =
                finalPDF.getPage(i);

            const state=
                pageStates[i];

            const {width,height}=
                finalPage.getSize();

            /*
             * Add overlays
             */

            for(const item of state.overlays){

                if(item.type==="text" ||
                   item.type==="watermark"){

                    let colorHex=
                        item.color.replace("#","");

                    const r=
                        parseInt(
                            colorHex.substring(0,2),16
                        )/255;

                    const g=
                        parseInt(
                            colorHex.substring(2,4),16
                        )/255;

                    const b=
                        parseInt(
                            colorHex.substring(4,6),16
                        )/255;

                    finalPage.drawText(
                        item.text,
                        {
                            x:item.x/zoom,
                            y:height-
                              item.y/zoom-
                              item.size/zoom,

                            size:item.size/zoom,

                            font:helvetica,

                            color:
                                PDFLib.rgb(r,g,b),

                            opacity:item.opacity
                        }
                    );

                }

                if(item.type==="image"){

                    try{

                        let image;

                        if(
                            item.src.startsWith(
                                "data:image/png"
                            )
                        ){

                            image=
                                await finalPDF.embedPng(
                                    item.src
                                );

                        }else{

                            image=
                                await finalPDF.embedJpg(
                                    item.src
                                );

                        }

                        finalPage.drawImage(
                            image,
                            {
                                x:item.x/zoom,
                                y:height-
                                  item.y/zoom-
                                  item.height/zoom,

                                width:item.width/zoom,

                                height:item.height/zoom
                            }
                        );

                    }catch(err){

                        console.log(
                            "Image error",
                            err
                        );

                    }

                }

            }

        }

        /*
         * Add blank pages if user created them.
         */

        if(pageStates.length>
           sourcePDF.getPageCount()){

            for(
                let i=sourcePDF.getPageCount();
                i<pageStates.length;
                i++
            ){

                const blank=
                    finalPDF.addPage([
                        595.28,
                        841.89
                    ]);

                const state=
                    pageStates[i];

                const {width,height}=
                    blank.getSize();

                for(const item of state.overlays){

                    if(item.type==="text" ||
                       item.type==="watermark"){

                        blank.drawText(
                            item.text,
                            {
                                x:item.x/zoom,

                                y:height-
                                  item.y/zoom-
                                  item.size/zoom,

                                size:item.size/zoom,

                                font:helvetica,

                                color:
                                    PDFLib.rgb(
                                        0,0,0
                                    ),

                                opacity:item.opacity
                            }
                        );

                    }

                }

            }

        }

        const bytes=
            await finalPDF.save();

        const blob=
            new Blob(
                [bytes],
                {type:"application/pdf"}
            );

        const url=
            URL.createObjectURL(blob);

        const a=
            document.createElement("a");

        a.href=url;

        a.download=
            "edited-pdf.pdf";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

        status("PDF downloaded successfully");

    }catch(error){

        console.error(error);

        alert(
            "Could not create the PDF.\n\n"+
            error.message
        );

    }

}


/*
 * Get original PDF bytes.
 *
 * PDF.js keeps the loaded document internally,
 * so we request the data from the document.
 */

async function getCurrentPDFBytes(){

    if(pdfDocument && pdfDocument.getData){

        return await pdfDocument.getData();

    }

    throw new Error(
        "Original PDF data is unavailable."
    );

}

</script>

</body>
</html>
