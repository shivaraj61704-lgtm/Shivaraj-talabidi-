 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free PDF Editor</title>

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PDF-LIB -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f6;
    color:#202124;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:64px;
    background:#ffffff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
}

.logo{
    font-size:21px;
    font-weight:700;
    color:#202124;
}

.logo span{
    color:#1677ff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    border:1px solid #d4d7dc;
    background:white;
    color:#202124;
    padding:9px 13px;
    border-radius:7px;
    font-size:14px;
}

.header-btn:hover{
    background:#f4f6f8;
}

.download-btn{
    background:#1677ff;
    color:white;
    border:none;
    padding:10px 17px;
    border-radius:7px;
    font-weight:600;
}

.download-btn:hover{
    background:#075fd5;
}

/* =========================================================
   MAIN LAYOUT
========================================================= */

.app{
    position:absolute;
    top:64px;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    overflow:hidden;
}

/* =========================================================
   LEFT TOOLBAR
========================================================= */

.toolbar{
    width:225px;
    min-width:225px;
    background:#fff;
    border-right:1px solid #ddd;
    padding:14px;
    overflow-y:auto;
}

.toolbar-title{
    font-size:13px;
    font-weight:bold;
    color:#777;
    margin:5px 0 10px;
    text-transform:uppercase;
}

.tool-button{
    width:100%;
    border:1px solid #e0e2e5;
    background:#fff;
    padding:11px 12px;
    margin-bottom:7px;
    border-radius:7px;
    text-align:left;
    font-size:14px;
}

.tool-button:hover{
    background:#f3f6fa;
}

.tool-button.primary{
    background:#1677ff;
    border-color:#1677ff;
    color:white;
}

.tool-button.danger{
    color:#d93025;
}

.tool-button.green{
    color:#188038;
}

.tool-section{
    border-top:1px solid #e2e2e2;
    margin-top:15px;
    padding-top:14px;
}

.setting-label{
    font-size:12px;
    color:#666;
    margin:7px 0 4px;
    display:block;
}

.setting-input{
    width:100%;
    border:1px solid #ccc;
    border-radius:6px;
    padding:8px;
    margin-bottom:6px;
}

.color-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.color-row input{
    width:48px;
    height:35px;
    padding:2px;
}

/* =========================================================
   ADD PAGE MENU
========================================================= */

.add-page-menu{
    display:none;
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:7px;
    margin-bottom:8px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.add-page-menu.show{
    display:block;
}

.add-page-menu button{
    display:block;
    width:100%;
    border:none;
    background:#f7f8fa;
    padding:10px;
    margin:3px 0;
    border-radius:6px;
    text-align:left;
}

.add-page-menu button:hover{
    background:#e8edf4;
}

/* =========================================================
   PAGE PANEL
========================================================= */

.page-panel{
    width:190px;
    min-width:190px;
    background:#f7f8fa;
    border-right:1px solid #ddd;
    overflow-y:auto;
    padding:12px;
}

.page-panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    font-weight:bold;
    color:#555;
}

.page-count{
    color:#999;
    font-weight:normal;
}

.thumbnail{
    background:white;
    border:2px solid transparent;
    border-radius:7px;
    margin-bottom:12px;
    padding:5px;
    position:relative;
    cursor:pointer;
    transition:.15s;
}

.thumbnail:hover{
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.thumbnail.active{
    border-color:#1677ff;
}

.thumbnail.dragging{
    opacity:.35;
}

.thumbnail.dragover{
    border-color:#1677ff;
    transform:scale(1.03);
}

.thumbnail canvas{
    width:100%;
    display:block;
    background:white;
}

.page-number{
    text-align:center;
    font-size:11px;
    color:#666;
    padding:5px 0 2px;
}

.page-delete{
    position:absolute;
    top:4px;
    right:4px;
    width:23px;
    height:23px;
    border:none;
    border-radius:50%;
    background:#e53935;
    color:white;
    font-size:15px;
    line-height:23px;
    padding:0;
}

.page-delete:hover{
    background:#c62828;
}

.blank-preview{
    width:100%;
    aspect-ratio:0.707;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
    border:1px solid #ddd;
    color:#aaa;
    font-size:24px;
}

.image-preview{
    width:100%;
    aspect-ratio:0.707;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:white;
}

.image-preview img{
    max-width:100%;
    max-height:100%;
}

/* =========================================================
   EDITOR
========================================================= */

.editor{
    flex:1;
    overflow:auto;
    background:#dfe3e8;
    position:relative;
}

.editor-inner{
    min-width:100%;
    min-height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:35px;
}

.page-wrapper{
    position:relative;
    background:white;
    box-shadow:0 5px 22px rgba(0,0,0,.25);
}

#pdfCanvas{
    display:block;
}

/* =========================================================
   OVERLAY ITEMS
========================================================= */

.overlay{
    position:absolute;
    cursor:move;
    user-select:none;
    border:1px dashed transparent;
}

.overlay:hover{
    border-color:#1677ff;
}

.overlay.selected{
    border:1px dashed #1677ff;
}

.text-overlay{
    white-space:nowrap;
    padding:3px 5px;
}

.watermark-overlay{
    white-space:nowrap;
    padding:3px 5px;
}

.image-overlay{
    overflow:hidden;
}

.image-overlay img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

/* =========================================================
   FLOATING ITEM DELETE
========================================================= */

.item-delete{
    position:absolute;
    right:-10px;
    top:-10px;
    width:20px;
    height:20px;
    border:none;
    background:#e53935;
    color:white;
    border-radius:50%;
    font-size:12px;
    display:none;
}

.overlay.selected .item-delete{
    display:block;
}

/* =========================================================
   EMPTY SCREEN
========================================================= */

.empty-screen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.empty-box{
    background:white;
    width:430px;
    max-width:90%;
    padding:45px 30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.empty-box h2{
    margin:0 0 8px;
}

.empty-box p{
    color:#777;
    line-height:1.5;
}

.big-open{
    background:#1677ff;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 25px;
    font-size:15px;
    margin-top:10px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#202124;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    display:none;
    z-index:5000;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:6000;
}

.loading-box{
    background:white;
    padding:25px 35px;
    border-radius:10px;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
    text-align:center;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top-color:#1677ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .toolbar{
        width:190px;
        min-width:190px;
    }

    .page-panel{
        width:150px;
        min-width:150px;
    }

}

@media(max-width:650px){

    .toolbar{
        width:160px;
        min-width:160px;
    }

    .page-panel{
        display:none;
    }

    .header-right .header-btn{
        display:none;
    }

    .logo{
        font-size:17px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        <span>PDF</span> Editor
    </div>

    <div class="header-right">

        <button
            class="header-btn"
            onclick="openPDF()">
            📄 Open PDF
        </button>

        <button
            class="header-btn"
            onclick="undo()">
            ↶
        </button>

        <button
            class="header-btn"
            onclick="redo()">
            ↷
        </button>

        <button
            class="download-btn"
            onclick="downloadPDF()">
            ⬇ Download PDF
        </button>

    </div>

</header>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div class="app">


<!-- =====================================================
     TOOLBAR
===================================================== -->

<aside class="toolbar">

    <div class="toolbar-title">
        Edit
    </div>

    <button
        class="tool-button primary"
        onclick="toggleAddPageMenu()">
        ➕ Add Page
    </button>

    <div
        id="addPageMenu"
        class="add-page-menu">

        <button onclick="addBlankPage()">
            📄 Blank Page
        </button>

        <button onclick="choosePDFToAdd()">
            📥 Add Pages from PDF
        </button>

        <button onclick="chooseImageAsPage()">
            🖼️ Add Image as Page
        </button>

    </div>


    <button
        class="tool-button"
        onclick="addText()">
        ✏️ Add Text
    </button>


    <button
        class="tool-button"
        onclick="addPhoto()">
        🖼️ Add Photo
    </button>


    <button
        class="tool-button"
        onclick="addWatermark()">
        💧 Add Watermark
    </button>


    <button
        class="tool-button"
        onclick="addPageNumbers()">
        🔢 Page Numbers
    </button>


    <div class="tool-section">

        <div class="toolbar-title">
            Page
        </div>

        <button
            class="tool-button"
            onclick="previousPage()">
            ← Previous Page
        </button>

        <button
            class="tool-button"
            onclick="nextPage()">
            Next Page →
        </button>

        <button
            class="tool-button"
            onclick="rotatePage()">
            🔄 Rotate
        </button>

        <button
            class="tool-button danger"
            onclick="deleteCurrentPage()">
            🗑️ Delete Page
        </button>

    </div>


    <div class="tool-section">

        <div class="toolbar-title">
            Text
        </div>

        <label class="setting-label">
            Text
        </label>

        <input
            id="textInput"
            class="setting-input"
            placeholder="Enter text">


        <label class="setting-label">
            Font Size
        </label>

        <input
            id="fontSize"
            class="setting-input"
            type="number"
            value="24"
            min="5"
            max="200">


        <label class="setting-label">
            Text Color
        </label>

        <div class="color-row">

            <input
                id="textColor"
                type="color"
                value="#000000">

            <span>Choose color</span>

        </div>

    </div>


    <div class="tool-section">

        <div class="toolbar-title">
            Watermark
        </div>

        <label class="setting-label">
            Watermark Text
        </label>

        <input
            id="watermarkInput"
            class="setting-input"
            placeholder="Your watermark">


        <label class="setting-label">
            Size
        </label>

        <input
            id="watermarkSize"
            class="setting-input"
            type="number"
            value="45"
            min="10"
            max="150">


        <label class="setting-label">
            Opacity
        </label>

        <input
            id="watermarkOpacity"
            type="range"
            min="0.05"
            max="1"
            value="0.3"
            step="0.05"
            style="width:100%">

    </div>


    <div class="tool-section">

        <div class="toolbar-title">
            View
        </div>

        <button
            class="tool-button"
            onclick="zoomOut()">
            − Zoom Out
        </button>

        <button
            class="tool-button"
            onclick="zoomIn()">
            + Zoom In
        </button>

    </div>


    <div class="tool-section">

        <button
            class="tool-button"
            onclick="undo()">
            ↶ Undo
        </button>

        <button
            class="tool-button"
            onclick="redo()">
            ↷ Redo
        </button>

        <button
            class="tool-button"
            onclick="clearCurrentPageItems()">
            🧹 Clear Added Items
        </button>

    </div>

</aside>


<!-- =====================================================
     PAGE THUMBNAILS
===================================================== -->

<aside class="page-panel">

    <div class="page-panel-title">

        <span>Pages</span>

        <span
            id="pageCount"
            class="page-count">
            0
        </span>

    </div>

    <div id="pages"></div>

</aside>


<!-- =====================================================
     EDITOR
===================================================== -->

<main class="editor">

    <div class="editor-inner">

        <div
            id="pageWrapper"
            class="page-wrapper"
            style="display:none">

            <canvas id="pdfCanvas"></canvas>

        </div>

    </div>


    <div
        id="emptyScreen"
        class="empty-screen">

        <div class="empty-box">

            <div class="empty-icon">
                📄
            </div>

            <h2>
                Free PDF Editor
            </h2>

            <p>
                Open a PDF to edit pages, add text,
                photos and watermarks, then download
                your finished PDF.
            </p>

            <button
                class="big-open"
                onclick="openPDF()">
                Open PDF
            </button>

        </div>

    </div>

</main>

</div>


<!-- =====================================================
     HIDDEN FILE INPUTS
===================================================== -->

<input
    id="pdfInput"
    type="file"
    accept="application/pdf"
    hidden>

<input
    id="extraPDFInput"
    type="file"
    accept="application/pdf"
    hidden>

<input
    id="imagePageInput"
    type="file"
    accept="image/png,image/jpeg,image/jpg"
    hidden>

<input
    id="photoInput"
    type="file"
    accept="image/png,image/jpeg,image/jpg"
    hidden>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status">
</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div
    id="loading"
    class="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            Creating PDF...
        </div>

    </div>

</div>


<script>

/* =========================================================
   PDF.JS SETUP
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let originalPDFBytes = null;

let pdfDocument = null;

let pages = [];

let currentPage = 0;

let zoom = 1.25;

let undoStack = [];

let redoStack = [];


/* =========================================================
   STATUS
========================================================= */

function showStatus(message){

    const status =
        document.getElementById("status");

    status.innerText = message;

    status.style.display = "block";

    setTimeout(function(){

        status.style.display = "none";

    },2500);

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(message){

    document.getElementById(
        "loadingText"
    ).innerText = message;

    document.getElementById(
        "loading"
    ).style.display = "flex";

}


function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display = "none";

}


/* =========================================================
   OPEN PDF
========================================================= */

function openPDF(){

    document
        .getElementById("pdfInput")
        .click();

}


document
.getElementById("pdfInput")
.addEventListener(
    "change",
    loadMainPDF
);


async function loadMainPDF(event){

    const file =
        event.target.files[0];

    if(!file) return;

    try{

        showLoading("Opening PDF...");

        originalPDFBytes =
            new Uint8Array(
                await file.arrayBuffer()
            );

        pdfDocument =
            await pdfjsLib.getDocument({
                data:originalPDFBytes
            }).promise;


        pages = [];


        for(
            let i=1;
            i<=pdfDocument.numPages;
            i++
        ){

            pages.push({

                type:"original",

                pageNumber:i,

                rotation:0,

                overlays:[]

            });

        }


        currentPage=0;

        undoStack=[];

        redoStack=[];


        document
            .getElementById("emptyScreen")
            .style.display="none";


        document
            .getElementById("pageWrapper")
            .style.display="block";


        await renderThumbnails();

        await renderCurrentPage();


        hideLoading();

        showStatus(
            "PDF opened — "+
            pages.length+
            " pages"
        );

    }
    catch(error){

        hideLoading();

        console.error(error);

        alert(
            "Unable to open this PDF.\n\n"+
            error.message
        );

    }

}


/* =========================================================
   SAVE STATE FOR UNDO
========================================================= */

function saveState(){

    undoStack.push(
        JSON.stringify(pages)
    );

    if(undoStack.length>30){

        undoStack.shift();

    }

    redoStack=[];

}


/* =========================================================
   UNDO
========================================================= */

async function undo(){

    if(undoStack.length===0){

        showStatus("Nothing to undo");

        return;

    }

    redoStack.push(
        JSON.stringify(pages)
    );

    pages =
        JSON.parse(
            undoStack.pop()
        );

    currentPage =
        Math.min(
            currentPage,
            pages.length-1
        );

    await renderThumbnails();

    await renderCurrentPage();

    showStatus("Undo");

}


/* =========================================================
   REDO
========================================================= */

async function redo(){

    if(redoStack.length===0){

        showStatus("Nothing to redo");

        return;

    }

    undoStack.push(
        JSON.stringify(pages)
    );

    pages =
        JSON.parse(
            redoStack.pop()
        );

    currentPage =
        Math.min(
            currentPage,
            pages.length-1
        );

    await renderThumbnails();

    await renderCurrentPage();

    showStatus("Redo");

}


/* =========================================================
   ADD PAGE MENU
========================================================= */

function toggleAddPageMenu(){

    document
        .getElementById("addPageMenu")
        .classList.toggle("show");

}


/* =========================================================
   CLOSE MENU
========================================================= */

function closeAddPageMenu(){

    document
        .getElementById("addPageMenu")
        .classList.remove("show");

}


/* =========================================================
   ADD BLANK PAGE
========================================================= */

async function addBlankPage(){

    saveState();

    pages.splice(
        currentPage+1,
        0,
        {

            type:"blank",

            width:595.28,

            height:841.89,

            rotation:0,

            overlays:[]

        }
    );

    currentPage++;

    closeAddPageMenu();

    await renderThumbnails();

    await renderCurrentPage();

    showStatus("Blank page added");

}


/* =========================================================
   ADD PDF PAGES
========================================================= */

function choosePDFToAdd(){

    document
        .getElementById("extraPDFInput")
        .click();

}


document
.getElementById("extraPDFInput")
.addEventListener(
    "change",
    importPDFPages
);


async function importPDFPages(event){

    const file =
        event.target.files[0];

    if(!file) return;

    try{

        saveState();

        showLoading(
            "Importing PDF pages..."
        );


        const bytes =
            new Uint8Array(
                await file.arrayBuffer()
            );


        const imported =
            await pdfjsLib.getDocument({
                data:bytes
            }).promise;


        const newPages=[];


        /*
         * Convert imported pages into
         * high quality images.
         */

        for(
            let i=1;
            i<=imported.numPages;
            i++
        ){

            const page =
                await imported.getPage(i);


            const viewport =
                page.getViewport({
                    scale:2
                });


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;


            await page.render({

                canvasContext:
                    canvas.getContext("2d"),

                viewport:viewport

            }).promise;


            newPages.push({

                type:"imagePage",

                src:
                    canvas.toDataURL(
                        "image/png"
                    ),

                width:
                    viewport.width,

                height:
                    viewport.height,

                rotation:0,

                overlays:[]

            });

        }


        /*
         * Insert after current page.
         */

        pages.splice(
            currentPage+1,
            0,
            ...newPages
        );


        currentPage++;


        closeAddPageMenu();

        await renderThumbnails();

        await renderCurrentPage();

        hideLoading();


        showStatus(
            newPages.length+
            " page(s) added"
        );

    }
    catch(error){

        hideLoading();

        console.error(error);

        alert(
            "Could not import PDF pages.\n\n"+
            error.message
        );

    }


    event.target.value="";

}


/* =========================================================
   ADD IMAGE AS PAGE
========================================================= */

function chooseImageAsPage(){

    document
        .getElementById("imagePageInput")
        .click();

}


document
.getElementById("imagePageInput")
.addEventListener(
    "change",
    importImageAsPage
);


function importImageAsPage(event){

    const file =
        event.target.files[0];

    if(!file) return;

    saveState();

    const reader =
        new FileReader();


    reader.onload=function(e){

        const img =
            new Image();


        img.onload=function(){

            pages.splice(
                currentPage+1,
                0,
                {

                    type:"imagePage",

                    src:e.target.result,

                    width:img.width,

                    height:img.height,

                    rotation:0,

                    overlays:[]

                }
            );


            currentPage++;


            closeAddPageMenu();

            renderThumbnails();

            renderCurrentPage();


            showStatus(
                "Image page added"
            );

        };


        img.src=e.target.result;

    };


    reader.readAsDataURL(file);

    event.target.value="";

}


/* =========================================================
   RENDER THUMBNAILS
========================================================= */

async function renderThumbnails(){

    const container =
        document.getElementById("pages");

    container.innerHTML="";


    document
        .getElementById("pageCount")
        .innerText=pages.length;


    for(
        let i=0;
        i<pages.length;
        i++
    ){

        const state=pages[i];


        const div =
            document.createElement("div");

        div.className="thumbnail";

        if(i===currentPage){

            div.classList.add("active");

        }


        div.draggable=true;

        div.dataset.index=i;


        /*
         * Preview
         */

        if(state.type==="blank"){

            const preview =
                document.createElement("div");

            preview.className=
                "blank-preview";

            preview.innerText="📄";

            div.appendChild(preview);

        }


        else if(
            state.type==="imagePage"
        ){

            const preview =
                document.createElement("div");

            preview.className=
                "image-preview";


            const img =
                document.createElement("img");

            img.src=state.src;

            preview.appendChild(img);

            div.appendChild(preview);

        }


        else if(
            state.type==="original"
        ){

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width=140;

            canvas.height=190;

            div.appendChild(canvas);

            drawOriginalThumbnail(
                canvas,
                state.pageNumber
            );

        }


        const number =
            document.createElement("div");

        number.className="page-number";

        number.innerText=
            "Page "+(i+1);


        div.appendChild(number);


        /*
         * Delete
         */

        const deleteBtn =
            document.createElement(
                "button"
            );

        deleteBtn.className=
            "page-delete";

        deleteBtn.innerText="×";


        deleteBtn.onclick=function(e){

            e.stopPropagation();

            deletePage(i);

        };


        div.appendChild(deleteBtn);


        /*
         * Click
         */

        div.onclick=function(){

            currentPage=i;

            renderThumbnails();

            renderCurrentPage();

        };


        /*
         * Drag reorder
         */

        div.addEventListener(
            "dragstart",
            function(e){

                div.classList.add(
                    "dragging"
                );

                e.dataTransfer.setData(
                    "text/plain",
                    i
                );

            }
        );


        div.addEventListener(
            "dragend",
            function(){

                div.classList.remove(
                    "dragging"
                );

                document
                    .querySelectorAll(
                        ".thumbnail"
                    )
                    .forEach(x=>
                        x.classList.remove(
                            "dragover"
                        )
                    );

            }
        );


        div.addEventListener(
            "dragover",
            function(e){

                e.preventDefault();

                div.classList.add(
                    "dragover"
                );

            }
        );


        div.addEventListener(
            "dragleave",
            function(){

                div.classList.remove(
                    "dragover"
                );

            }
        );


        div.addEventListener(
            "drop",
            function(e){

                e.preventDefault();

                const from =
                    Number(
                        e.dataTransfer.getData(
                            "text/plain"
                        )
                    );

                const to=i;


                if(from===to){

                    return;

                }


                saveState();


                const moved =
                    pages.splice(
                        from,
                        1
                    )[0];


                pages.splice(
                    to,
                    0,
                    moved
                );


                currentPage=to;


                renderThumbnails();

                renderCurrentPage();


                showStatus(
                    "Pages reordered"
                );

            }
        );


        container.appendChild(div);

    }

}


/* =========================================================
   ORIGINAL THUMBNAIL
========================================================= */

async function drawOriginalThumbnail(
    canvas,
    pageNumber
){

    if(!pdfDocument) return;

    try{

        const page =
            await pdfDocument.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale:.23
            });


        canvas.width=
            viewport.width;

        canvas.height=
            viewport.height;


        await page.render({

            canvasContext:
                canvas.getContext("2d"),

            viewport:viewport

        }).promise;

    }
    catch(error){

        console.log(error);

    }

}


/* =========================================================
   RENDER CURRENT PAGE
========================================================= */

async function renderCurrentPage(){

    if(
        pages.length===0 ||
        !pages[currentPage]
    ){

        return;

    }


    const state =
        pages[currentPage];


    if(state.type==="original"){

        await renderOriginalPage(state);

    }

    else if(state.type==="blank"){

        renderBlankPage(state);

    }

    else if(state.type==="imagePage"){

        renderImagePage(state);

    }

}


/* =========================================================
   RENDER ORIGINAL PAGE
========================================================= */

async function renderOriginalPage(state){

    const page =
        await pdfDocument.getPage(
            state.pageNumber
        );


    const viewport =
        page.getViewport({

            scale:zoom,

            rotation:state.rotation

        });


    const canvas =
        document.getElementById(
            "pdfCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    canvas.width=
        viewport.width;

    canvas.height=
        viewport.height;


    await page.render({

        canvasContext:ctx,

        viewport:viewport

    }).promise;


    setWrapperSize(
        viewport.width,
        viewport.height
    );


    removeOverlayElements();

    renderOverlays();

}


/* =========================================================
   BLANK PAGE
========================================================= */

function renderBlankPage(state){

    const canvas =
        document.getElementById(
            "pdfCanvas"
        );


    const width =
        state.width*zoom;

    const height =
        state.height*zoom;


    canvas.width=width;

    canvas.height=height;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    setWrapperSize(
        width,
        height
    );


    removeOverlayElements();

    renderOverlays();

}


/* =========================================================
   IMAGE PAGE
========================================================= */

function renderImagePage(state){

    const canvas =
        document.getElementById(
            "pdfCanvas"
        );


    const wrapper =
        document.getElementById(
            "pageWrapper"
        );


    const img =
        new Image();


    img.onload=function(){

        let w =
            img.width*zoom;

        let h =
            img.height*zoom;


        if(
            state.rotation===90 ||
            state.rotation===270
        ){

            [w,h]=[h,w];

        }


        canvas.width=w;

        canvas.height=h;


        const ctx =
            canvas.getContext("2d");


        ctx.fillStyle="white";

        ctx.fillRect(
            0,
            0,
            w,
            h
        );


        ctx.save();


        if(state.rotation===90){

            ctx.translate(
                w,
                0
            );

            ctx.rotate(
                Math.PI/2
            );

        }

        else if(state.rotation===180){

            ctx.translate(
                w,
                h
            );

            ctx.rotate(
                Math.PI
            );

        }

        else if(state.rotation===270){

            ctx.translate(
                0,
                h
            );

            ctx.rotate(
                -Math.PI/2
            );

        }


        ctx.drawImage(
            img,
            0,
            0,
            img.width*zoom,
            img.height*zoom
        );


        ctx.restore();


        setWrapperSize(
            w,
            h
        );


        removeOverlayElements();

        renderOverlays();

    };


    img.src=state.src;

}


/* =========================================================
   WRAPPER SIZE
========================================================= */

function setWrapperSize(
    width,
    height
){

    const wrapper =
        document.getElementById(
            "pageWrapper"
        );


    wrapper.style.width=

/* =========================================================
   OVERLAYS
========================================================= */

function removeOverlayElements(){

    document
        .querySelectorAll(".overlay")
        .forEach(
            e=>e.remove()
        );

}


function renderOverlays(){

    const state =
        pages[currentPage];


    if(!state) return;


    state.overlays.forEach(
        (item,index)=>{

            let element;


            if(
                item.type==="text" ||
                item.type==="watermark"
            ){

                element =
                    document.createElement(
                        "div"
                    );


                element.className=
                    "overlay "+
                    (
                        item.type==="watermark"
                        ?
                        "watermark-overlay"
                        :
                        "text-overlay"
                    );


                element.innerText=
                    item.text;


                element.style.fontSize=
                    item.size+"px";


                element.style.color=
                    item.color;


                element.style.opacity=
                    item.opacity;


            }


            else if(
                item.type==="image"
            ){

                element =
                    document.createElement(
                        "div"
                    );


                element.className=
                    "overlay image-overlay";


                element.style.width=
                    item.width+"px";


                element.style.height=
                    item.height+"px";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src=item.src;


                element.appendChild(img);

            }


            element.style.left=
                item.x+"px";


            element.style.top=
                item.y+"px";


            element.dataset.index=
                index;


            /*
             * Delete button
             */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className=
                "item-delete";

            deleteButton.innerText="×";


            deleteButton.onclick=function(e){

                e.stopPropagation();

                saveState();

                state.overlays.splice(
                    index,
                    1
                );

                renderCurrentPage();

            };


            element.appendChild(
                deleteButton
            );


            makeDraggable(element);


            element.addEventListener(
                "click",
                function(e){

                    e.stopPropagation();

                    document
                        .querySelectorAll(
                            ".overlay"
                        )
                        .forEach(
                            x=>
                            x.classList.remove(
                                "selected"
                            )
                        );


                    element.classList.add(
                        "selected"
                    );

                }
            );


            document
                .getElementById(
                    "pageWrapper"
                )
                .appendChild(
                    element
                );

        }
    );

}


/* =========================================================
   DRAG OVERLAY
========================================================= */

function makeDraggable(element){

    let startX=0;

    let startY=0;

    let startLeft=0;

    let startTop=0;


    element.addEventListener(
        "mousedown",
        function(e){

            if(
                e.target.classList.contains(
                    "item-delete"
                )
            ){

                return;

            }


            e.preventDefault();


            startX=e.clientX;

            startY=e.clientY;


            startLeft=
                parseFloat(
                    element.style.left
                )||0;


            startTop=
                parseFloat(
                    element.style.top
                )||0;


            const index =
                Number(
                    element.dataset.index
                );


            function move(ev){

                const dx =
                    ev.clientX-startX;

                const dy =
                    ev.clientY-startY;


                element.style.left=
                    Math.max(
                        0,
                        startLeft+dx
                    )+"px";


                element.style.top=
                    Math.max(
                        0,
                        startTop+dy
                    )+"px";

            }


            function stop(){

                document.removeEventListener(
                    "mousemove",
                    move
                );


                document.removeEventListener(
                    "mouseup",
                    stop
                );


                const state =
                    pages[currentPage];


                if(
                    state &&
                    state.overlays[index]
                ){

                    state.overlays[index].x=
                        parseFloat(
                            element.style.left
                        );


                    state.overlays[index].y=
                        parseFloat(
                            element.style.top
                        );

                }

            }


            document.addEventListener(
                "mousemove",
                move
            );


            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );

}

/* =========================================================
   DOWNLOAD PDF
========================================================= */

async function downloadPDF(){

    if(
        !originalPDFBytes &&
        pages.length===0
    ){

        alert(
            "Please open or create a PDF first."
        );

        return;

    }


    try{

        showLoading(
            "Creating your PDF..."
        );


        const output =
            await PDFLib.PDFDocument.create();


        const font =
            await output.embedFont(
                PDFLib.StandardFonts.Helvetica
            );


        /*
         * Process every page.
         */

        for(
            let i=0;
            i<pages.length;
            i++
        ){

            const state=pages[i];


            /*
             * ORIGINAL PDF PAGE
             */

            if(
                state.type==="original"
            ){

                const source =
                    await PDFLib.PDFDocument.load(
                        originalPDFBytes
                    );


                const copied =
                    await output.copyPages(
                        source,
                        [state.pageNumber-1]
                    );


                const page=
                    copied[0];


                output.addPage(page);


                /*
                 * Rotate
                 */

                if(state.rotation){

                    page.setRotation(
                        PDFLib.degrees(
                            state.rotation
                        )
                    );

                }


                await drawExportOverlays(
                    page,
                    state,
                    output,
                    font
                );

            }


            /*
             * BLANK PAGE
             */

            else if(
                state.type==="blank"
            ){

                let width =
                    state.width;

                let height =
                    state.height;


                if(
                    state.rotation===90 ||
                    state.rotation===270
                ){

                    [width,height]=
                        [height,width];

                }


                const page =
                    output.addPage([
                        width,
                        height
                    ]);


                await drawExportOverlays(
                    page,
                    state,
                    output,
                    font
                );

            }


            /*
             * IMAGE PAGE
             */

            else if(
                state.type==="imagePage"
            ){

                const image =
                    await output.embedPng(
                        state.src
                    );


                let width =
                    image.width;

                let height =
                    image.height;


                const maxWidth=595;

                const maxHeight=842;


                const scale =
                    Math.min(
                        maxWidth/width,
                        maxHeight/height,
                        1
                    );


                width*=scale;

                height*=scale;


                const page =
                    output.addPage([
                        width,
                        height
                    ]);


                page.drawImage(
                    image,
                    {
                        x:0,
                        y:0,
                        width:width,
                        height:height
                    }
                );


                if(state.rotation){

                    page.setRotation(
                        PDFLib.degrees(
                            state.rotation
                        )
                    );

                }


                await drawExportOverlays(
                    page,
                    state,
                    output,
                    font
                );

            }

        }


        /*
         * Save
         */

        const bytes =
            await output.save();


        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href=url;

        a.download=
            "edited-pdf.pdf";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        hideLoading();

        showStatus(
            "PDF downloaded successfully"
        );

    }
    catch(error){

        hideLoading();

        console.error(error);

        alert(
            "PDF export failed.\n\n"+
            error.message
        );

    }

}


/* =========================================================
   EXPORT OVERLAYS
========================================================= */

async function drawExportOverlays(
    page,
    state,
    output,
    font
){

    const {width,height}=
        page.getSize();


    for(
        const item of state.overlays
    ){

        /*
         * TEXT / WATERMARK
         */

        if(
            item.type==="text" ||
            item.type==="watermark"
        ){

            const color =
                hexToRGB(
                    item.color
                );


            /*
             * The editor uses CSS pixels.
             * Convert them approximately
             * to PDF points.
             */

            const scaleFactor =
                1/zoom;


            const x =
                item.x*
                scaleFactor;


            const y =
                height-
                (
                    item.y+
                    item.size
                )*
                scaleFactor;


            page.drawText(
                item.text,
                {

                    x:x,

                    y:y,

                    size:
                        item.size*
                        scaleFactor,

                    font:font,

                    color:
                        PDFLib.rgb(
                            color.r,
                            color.g,
                            color.b
                        ),

                    opacity:
                        item.opacity

                }
            );

        }


        /*
         * IMAGE
         */

        if(
            item.type==="image"
        ){

            try{

                let image;


                if(
                    item.src.startsWith(
                        "data:image/png"
                    )
                ){

                    image=
                        await output.embedPng(
                            item.src
                        );

                }
                else{

                    image=
                        await output.embedJpg(
                            item.src
                        );

                }


                page.drawImage(
                    image,
                    {

                        x:
                            item.x/
                            zoom,

                        y:
                            height-
                            (
                                item.y+
                                item.height
                            )/
                            zoom,

                        width:
                            item.width/
                            zoom,

                        height:
                            item.height/
                            zoom

                    }
                );

            }
            catch(error){

                console.log(
                    "Image export error",
                    error
                );

            }

        }

    }

}


/* =========================================================
   HEX TO RGB
========================================================= */

function hexToRGB(hex){

    hex=
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(0,2),
                16
            )/255,

        g:
            parseInt(
                hex.substring(2,4),
                16
            )/255,

        b:
            parseInt(
                hex.substring(4,6),
                16
            )/255

    };

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        /*
         * Delete selected overlay
         */

        if(
            e.key==="Delete"
        ){

            const selected =
                document.querySelector(
                    ".overlay.selected"
                );


            if(selected){

                const index =
                    Number(
                        selected.dataset.index
                    );


                saveState();


                pages[
                    currentPage
                ].overlays.splice(
                    index,
                    1
                );


                renderCurrentPage();

            }

        }


        /*
         * Ctrl + Z
         */

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

        }


        /*
         * Ctrl + Y
         */

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

        }


        /*
         * Arrow page navigation
         */

        if(
            e.key==="ArrowRight" &&
            !e.ctrlKey
        ){

            nextPage();

        }


        if(
            e.key==="ArrowLeft" &&
            !e.ctrlKey
        ){

            previousPage();

        }

    }
);


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function(e){

        if(
            !e.target.closest(
                ".add-page-menu"
            ) &&
            !e.target.closest(
                ".primary"
            )
        ){

            closeAddPageMenu();

        }


        if(
            !e.target.closest(
                ".overlay"
            )
        ){

            document
                .querySelectorAll(
                    ".overlay"
                )
                .forEach(
                    x=>
                    x.classList.remove(
                        "selected"
                    )
                );

        }

    }
);

</script>
