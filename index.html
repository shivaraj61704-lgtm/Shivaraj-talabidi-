/* =========================================================
PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
GLOBAL VARIABLES
========================================================= */

let mode="pdf";

let originalPDF=null;

let originalPPT=null;

let pdfDocument=null;

let pages=[];

let currentPage=0;

let zoom=1.25;

let undoStack=[];

let redoStack=[];


/* =========================================================
UTILITY
========================================================= */

function status(message){

    const s=
        document.getElementById("status");

    s.innerText=message;

    s.style.display="block";

    setTimeout(
        ()=>s.style.display="none",
        2500
    );

}


function loading(message){

    document.getElementById(
        "loadingText"
    ).innerText=message;

    document.getElementById(
        "loading"
    ).style.display="flex";

}


function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display="none";

}


/* =========================================================
MODE
========================================================= */

function setMode(newMode){

    mode=newMode;

    document
        .getElementById("pdfModeBtn")
        .classList.toggle(
            "active",
            mode==="pdf"
        );

    document
        .getElementById("pptModeBtn")
        .classList.toggle(
            "active",
            mode==="ppt"
        );

    document
        .getElementById("pageTitle")
        .innerText=
        mode==="pdf"
        ?"Pages"
        :"Slides";

}


/* =========================================================
OPEN
========================================================= */

function openDocument(){

    document
        .getElementById("mainFile")
        .click();

}


document
.getElementById("mainFile")
.addEventListener(
    "change",
    handleMainFile
);


async function handleMainFile(event){

    const file=event.target.files[0];

    if(!file) return;

    const name=
        file.name.toLowerCase();

    try{

        if(name.endsWith(".pdf")){

            await openPDF(file);

        }

        else if(
            name.endsWith(".pptx")
        ){

            await openPPTX(file);

        }

        else{

            alert(
                "Please select a PDF or PPTX file."
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "Unable to open file.\n\n"+
            error.message
        );

    }

    event.target.value="";

}


/* =========================================================
OPEN PDF
========================================================= */

async function openPDF(file){

    loading("Opening PDF...");

    originalPDF=
        new Uint8Array(
            await file.arrayBuffer()
        );

    pdfDocument=
        await pdfjsLib.getDocument({
            data:originalPDF
        }).promise;


    pages=[];


    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){

        pages.push({

            type:"pdf",

            pageNumber:i,

            rotation:0,

            overlays:[]

        });

    }


    mode="pdf";

    setMode("pdf");

    currentPage=0;

    undoStack=[];

    redoStack=[];


    showEditor();

    await renderThumbnails();

    await renderCurrentPage();

    hideLoading();

    status(
        pdfDocument.numPages+
        " PDF page(s) loaded"
    );

}


/* =========================================================
OPEN PPTX
========================================================= */

async function openPPTX(file){

    loading("Reading PowerPoint...");

    const bytes=
        new Uint8Array(
            await file.arrayBuffer()
        );

    originalPPT=bytes;

    pages=
        await parsePPTX(bytes);


    if(!pages.length){

        throw new Error(
            "No slides were found."
        );

    }


    mode="ppt";

    setMode("ppt");

    currentPage=0;

    undoStack=[];

    redoStack=[];

    showEditor();

    await renderThumbnails();

    await renderCurrentPage();

    hideLoading();

    status(
        pages.length+
        " slide(s) loaded"
    );

}


/* =========================================================
SHOW EDITOR
========================================================= */

function showEditor(){

    document
        .getElementById("empty")
        .style.display="none";

    document
        .getElementById("pageWrapper")
        .style.display="block";

}


/* =========================================================
PPTX PARSER
========================================================= */

/*
   This parser reads the basic PPTX structure:

   ppt/slides/slideX.xml
   ppt/slides/_rels/slideX.xml.rels
   ppt/media/*

   It extracts:
   - slide size
   - text
   - images
   - basic positions

   This makes the browser editor able to work
   without a paid API/server.
*/

async function parsePPTX(bytes){

    const zip=
        await JSZip.loadAsync(bytes);

    const slideFiles=[];


    Object.keys(zip.files)
    .filter(
        x=>
        /^ppt\/slides\/slide\d+\.xml$/
        .test(x)
    )
    .forEach(
        x=>slideFiles.push(x)
    );


    slideFiles.sort(
        (a,b)=>{

            const na=
                Number(
                    a.match(/slide(\d+)/)[1]
                );

            const nb=
                Number(
                    b.match(/slide(\d+)/)[1]
                );

            return na-nb;

        }
    );


    /*
     * Default widescreen size.
     * PPTX normally uses EMU units.
     */

    const slideWidth=13.333;

    const slideHeight=7.5;


    const result=[];


    for(
        const slideFile of slideFiles
    ){

        const xml=
            await zip
                .file(slideFile)
                .async("text");


        const elements=[];


        /*
         * TEXT BOXES
         */

        const shapeMatches=
            xml.match(
                /<p:sp[\s\S]*?<\/p:sp>/g
            )||[];


        for(
            const shape of shapeMatches
        ){

            const textMatches=
                [
                    ...shape.matchAll(
                        /<a:t>([\s\S]*?)<\/a:t>/g
                    )
                ];


            if(!textMatches.length)
                continue;


            let text=
                textMatches
                .map(
                    x=>
                    decodeXML(x[1])
                )
                .join("");


            /*
             * Position
             */

            const off =
                shape.match(
                    /<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/
                );


            const ext =
                shape.match(
                    /<a:ext[^>]*cx="(\d+)"[^>]*cy="(\d+)"/
                );


            let x=1;

            let y=1;

            let w=5;

            let h=1;


            if(off){

                x=
                    Number(off[1])/
                    914400;

                y=
                    Number(off[2])/
                    914400;

            }


            if(ext){

                w=
                    Number(ext[1])/
                    914400;

                h=
                    Number(ext[2])/
                    914400;

            }


            elements.push({

                type:"pptText",

                text:text,

                x:x,

                y:y,

                w:w,

                h:h,

                fontSize:24,

                color:"#000000"

            });

        }


        /*
         * IMAGES
         */

        const pictureMatches=
            xml.match(
                /<p:pic[\s\S]*?<\/p:pic>/g
            )||[];


        for(
            const picture of pictureMatches
        ){

            const embed=
                picture.match(
                    /r:embed="([^"]+)"/
                );


            if(!embed)
                continue;


            const relPath=
                slideFile
                .replace(
                    /ppt\/slides\/slide\d+\.xml$/,
                    "ppt/slides/_rels/"
                )+
                slideFile.match(
                    /slide\d+\.xml$/
                )[0]+
                ".rels";


            let mediaPath=null;


            if(zip.file(relPath)){

                const relXML=
                    await zip
                        .file(relPath)
                        .async("text");


                const relRegex=
                    new RegExp(
                        '<Relationship[^>]*Id="'+
                        escapeRegExp(embed[1])+
                        '"[^>]*Target="([^"]+)"'
                    );


                const rel=
                    relXML.match(relRegex);


                if(rel){

                    mediaPath=
                        normalizeMediaPath(
                            rel[1]
                        );

                }

            }


            if(
                !mediaPath ||
                !zip.file(mediaPath)
            )
                continue;


            const imageBytes=
                await zip
                    .file(mediaPath)
                    .async("base64");


            const ext=
                mediaPath
                .split(".")
                .pop()
                .toLowerCase();


            const dataURL=
                "data:image/"+
                (
                    ext==="jpg" ||
                    ext==="jpeg"
                    ?"jpeg"
                    :
                    ext
                )+
                ";base64,"+
                imageBytes;


            const off=
                picture.match(
                    /<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/
                );


            const ex=
                picture.match(
                    /<a:ext[^>]*cx="(\d+)"[^>]*cy="(\d+)"/
                );


            let x=1;

            let y=1;

            let w=3;

            let h=2;


            if(off){

                x=
                    Number(off[1])/
                    914400;

                y=
                    Number(off[2])/
                    914400;

            }


            if(ex){

                w=
                    Number(ex[1])/
                    914400;

                h=
                    Number(ex[2])/
                    914400;

            }


            elements.push({

                type:"pptImage",

                src:dataURL,

                x:x,

                y:y,

                w:w,

                h:h

            });

        }


        result.push({

            type:"ppt",

            width:slideWidth,

            height:slideHeight,

            rotation:0,

            overlays:[],

            elements:elements

        });

    }


    return result;

}


/* =========================================================
XML HELPERS
========================================================= */

function decodeXML(text){

    return text
        .replace(
            /&amp;/g,
            "&"
        )
        .replace(
            /&lt;/g,
            "<"
        )
        .replace(
            /&gt;/g,
            ">"
        )
        .replace(
            /&quot;/g,
            '"'
        )
        .replace(
            /&apos;/g,
            "'"
        );

}


function escapeRegExp(text){

    return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


function normalizeMediaPath(path){

    path=
        path.replace(
            /\\/g,
            "/"
        );


    if(
        path.startsWith("../")
    ){

        return "ppt/"+
            path.replace(
                /^(\.\.\/)+/,
                ""
            );

    }


    if(
        path.startsWith("/")
    ){

        return path.substring(1);

    }


    return "ppt/slides/"+
        path;

}


/* =========================================================
THUMBNAILS
========================================================= */

async function renderThumbnails(){

    const container=
        document.getElementById(
            "thumbnails"
        );

    container.innerHTML="";


    document.getElementById(
        "pageCount"
    ).innerText=pages.length;


    for(
        let i=0;
        i<pages.length;
        i++
    ){

        const div=
            document.createElement(
                "div"
            );


        div.className=
            "thumbnail";


        if(i===currentPage){

            div.classList.add(
                "active"
            );

        }


        div.draggable=true;


        /*
         * Preview canvas
         */

        const canvas=
            document.createElement(
                "canvas"
            );


        canvas.width=160;

        canvas.height=100;


        div.appendChild(canvas);


        const label=
            document.createElement(
                "div"
            );


        label.className=
            "thumb-label";


        label.innerText=
            (
                mode==="ppt"
                ?"Slide "
                :"Page "
            )+
            (i+1);


        div.appendChild(label);


        /*
         * Delete
         */

        const del=
            document.createElement(
                "button"
            );


        del.className=
            "thumb-delete";


        del.innerText="×";


        del.onclick=function(e){

            e.stopPropagation();

            deletePage(i);

        };


        div.appendChild(del);


        div.onclick=function(){

            currentPage=i;

            renderThumbnails();

            renderCurrentPage();

        };


        /*
         * Dragging
         */

        div.addEventListener(
            "dragstart",
            function(e){

                e.dataTransfer.setData(
                    "text/plain",
                    i
                );

                div.classList.add(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "dragend",
            function(){

                div.classList.remove(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "dragover",
            function(e){

                e.preventDefault();

                div.classList.add(
                    "dragover"
                );

            }
        );


        div.addEventListener(
            "dragleave",
            function(){

                div.classList.remove(
                    "dragover"
                );

            }
        );


        div.addEventListener(
            "drop",
            function(e){

                e.preventDefault();

                div.classList.remove(
                    "dragover"
                );


                const from=
                    Number(
                        e.dataTransfer.getData(
                            "text/plain"
                        )
                    );


                const to=i;


                if(from===to)
                    return;


                saveState();


                const moved=
                    pages.splice(
                        from,
                        1
                    )[0];


                pages.splice(
                    to,
                    0,
                    moved
                );


                currentPage=to;


                renderThumbnails();

                renderCurrentPage();

                status(
                    "Pages/slides reordered"
                );

            }
        );


        container.appendChild(div);


        /*
         * Draw preview
         */

        await drawThumbnail(
            canvas,
            pages[i]
        );

    }

}


/* =========================================================
THUMBNAIL DRAW
========================================================= */

async function drawThumbnail(
    canvas,
    state
){

    const ctx=
        canvas.getContext("2d");


    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(state.type==="ppt"){

        drawPPTToCanvas(
            canvas,
            state,
            true
        );

        return;

    }


    if(state.type==="imagePage"){

        const img=
            new Image();


        img.onload=function(){

            const scale=
                Math.min(
                    canvas.width/img.width,
                    canvas.height/img.height
                );


            const w=
                img.width*scale;

            const h=
                img.height*scale;


            ctx.drawImage(
                img,
                (canvas.width-w)/2,
                (canvas.height-h)/2,
                w,
                h
            );

        };


        img.src=state.src;

        return;

    }


    if(state.type==="blank"){

        ctx.strokeStyle="#ddd";

        ctx.strokeRect(
            1,
            1,
            canvas.width-2,
            canvas.height-2
        );

        return;

    }


    if(state.type==="pdf"){

        if(!pdfDocument)
            return;


        const page=
            await pdfDocument.getPage(
                state.pageNumber
            );


        const viewport=
            page.getViewport({
                scale:.22
            });


        canvas.width=
            viewport.width;

        canvas.height=
            viewport.height;


        await page.render({

            canvasContext:ctx,

            viewport:viewport

        }).promise;

    }

}


/* =========================================================
RENDER CURRENT
========================================================= */

async function renderCurrentPage(){

    if(!pages.length)
        return;


    const state=
        pages[currentPage];


    if(state.type==="pdf"){

        await renderPDFPage(
            state
        );

    }

    else if(state.type==="ppt"){

        renderPPTPage(
            state
        );

    }

    else if(
        state.type==="blank"
    ){

        renderBlankPage(
            state
        );

    }

    else if(
        state.type==="imagePage"
    ){

        renderImagePage(
            state
        );

    }

}


/* =========================================================
PDF PAGE
========================================================= */

async function renderPDFPage(state){

    const page=
        await pdfDocument.getPage(
            state.pageNumber
        );


    const viewport=
        page.getViewport({

            scale:zoom,

            rotation:state.rotation

        });


    const canvas=
        document.getElementById(
            "mainCanvas"
        );


    canvas.width=
        viewport.width;

    canvas.height=
        viewport.height;


    await page.render({

        canvasContext:
            canvas.getContext("2d"),

        viewport:viewport

    }).promise;


    setWrapper(
        viewport.width,
        viewport.height
    );


    removeElements();

    renderOverlays();

}

/* =========================================================
IMAGE PAGE
========================================================= */

function renderImagePage(state){

    const canvas=
        document.getElementById(
            "mainCanvas"
        );


    const img=
        new Image();


    img.onload=function(){

        let w=
            img.width*zoom;

        let h=
            img.height*zoom;


        if(
            state.rotation===90 ||
            state.rotation===270
        ){

            [w,h]=[h,w];

        }


        canvas.width=w;

        canvas.height=h;


        const ctx=
            canvas.getContext("2d");


        ctx.fillStyle="white";

        ctx.fillRect(
            0,
            0,
            w,
            h
        );


        ctx.save();


        if(state.rotation===90){

            ctx.translate(w,0);

            ctx.rotate(
                Math.PI/2
            );

        }

        else if(
            state.rotation===180
        ){

            ctx.translate(w,h);

            ctx.rotate(
                Math.PI
            );

        }

        else if(
            state.rotation===270
        ){

            ctx.translate(0,h);

            ctx.rotate(
                -Math.PI/2
            );

        }


        ctx.drawImage(
            img,
            0,
            0,
            img.width*zoom,
            img.height*zoom
        );


        ctx.restore();


        setWrapper(
            w,
            h
        );


        removeElements();

        renderOverlays();

    };


    img.src=state.src;

}

PPT PAGE

function renderPPTPage(state){

    const height=

/* =========================================================
DRAW PPT
========================================================= */

function drawPPTToCanvas(
    canvas,
    state,
    thumbnail
){

    const ctx=
        canvas.getContext("2d");


    const scale=
        thumbnail
        ?
        Math.min(
            canvas.width/
            (
                state.width*96
            ),
            canvas.height/
            (
                state.height*96
            )
        )
        :
        zoom;


    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Existing PPT text
     */

    if(state.elements){

        state.elements.forEach(
            element=>{

                if(
                    element.type==="pptText"
                ){

                    const x=
                        element.x*
                        96*
                        scale;

                    const y=
                        element.y*
                        96*
                        scale;


                    const size=
                        element.fontSize*
                        scale;


                    ctx.fillStyle=
                        element.color||
                        "#000000";


                    ctx.font=
                        size+
                        "px Arial";


                    /*
                     * Wrap basic text
                     */

                    wrapText(
                        ctx,
                        element.text,
                        x,
                        y+
                        size,
                        Math.max(
                            100,
                            element.w*
                            96*
                            scale
                        ),
                        size*1.25
                    );

                }


                if(
                    element.type==="pptImage"
                ){

                    const img=
                        new Image();


                    img.onload=function(){

                        ctx.drawImage(

                            img,

                            element.x*
                            96*
                            scale,

                            element.y*
                            96*
                            scale,

                            element.w*
                            96*
                            scale,

                            element.h*
                            96*
                            scale

                        );

                    };


                    img.src=
                        element.src;

                }

            }
        );

    }

}


/* =========================================================
TEXT WRAP
========================================================= */

function wrapText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight
){

    const words=
        text.split(" ");

    let line="";


    for(
        let n=0;
        n<words.length;
        n++
    ){

        const test=
            line+
            words[n]+
            " ";


        const metrics=
            ctx.measureText(
                test
            );


        if(
            metrics.width>
            maxWidth &&
            n>0
        ){

            ctx.fillText(
                line,
                x,
                y
            );

            line=
                words[n]+
                " ";

            y+=lineHeight;

        }

        else{

            line=test;

        }

    }


    ctx.fillText(
        line,
        x,
        y
    );

}

/* =========================================================
OVERLAYS
========================================================= */

function removeElements(){

    document
        .querySelectorAll(
            ".element"
        )
        .forEach(
            x=>x.remove()
        );

}


function renderOverlays(){

    const state=
        pages[currentPage];


    if(!state)
        return;


    if(!state.overlays)
        state.overlays=[];


    state.overlays.forEach(
        (item,index)=>{

            let element;


            if(
                item.type==="text" ||
                item.type==="watermark"
            ){

                element=
                    document.createElement(
                        "div"
                    );


                element.className=
                    "element "+
                    (
                        item.type==="watermark"
                        ?
                        "element-watermark"
                        :
                        "element-text"
                    );


                element.innerText=
                    item.text;


                element.style.fontSize=
                    item.size+"px";


                element.style.color=
                    item.color;


                element.style.opacity=
                    item.opacity;

            }


            if(
                item.type==="image"
            ){

                element=
                    document.createElement(
                        "div"
                    );


                element.className=
                    "element element-image";


                element.style.width=
                    item.width+"px";


                element.style.height=
                    item.height+"px";


                const img=
                    document.createElement(
                        "img"
                    );


                img.src=item.src;

                element.appendChild(img);

            }


            element.style.left=
                item.x+"px";


            element.style.top=
                item.y+"px";


            element.dataset.index=
                index;


            const deleteBtn=
                document.createElement(
                    "button"
                );


            deleteBtn.className=
                "element-delete";

            deleteBtn.innerText="×";


            deleteBtn.onclick=function(e){

                e.stopPropagation();

                saveState();

                state.overlays.splice(
                    index,
                    1
                );

                renderCurrentPage();

            };


            element.appendChild(
                deleteBtn
            );


            makeDraggable(
                element
            );


            element.onclick=function(e){

                e.stopPropagation();

                document
                    .querySelectorAll(
                        ".element"
                    )
                    .forEach(
                        x=>
                        x.classList.remove(
                            "selected"
                        )
                    );


                element.classList.add(
                    "selected"
                );

            };


            document
                .getElementById(
                    "pageWrapper"
                )
                .appendChild(
                    element
                );

        }
    );

}


/* =========================================================
DRAG ELEMENT
========================================================= */

function makeDraggable(element){

    element.addEventListener(
        "mousedown",
        function(e){

            if(
                e.target.classList.contains(
                    "element-delete"
                )
            )
                return;


            e.preventDefault();


            const startX=e.clientX;

            const startY=e.clientY;


            const startLeft=
                parseFloat(
                    element.style.left
                )||0;


            const startTop=
                parseFloat(
                    element.style.top
                )||0;


            const index=
                Number(
                    element.dataset.index
                );


            function move(ev){

                element.style.left=
                    Math.max(
                        0,
                        startLeft+
                        ev.clientX-
                        startX
                    )+"px";


                element.style.top=
                    Math.max(
                        0,
                        startTop+
                        ev.clientY-
                        startY
                    )+"px";

            }


            function stop(){

                document.removeEventListener(
                    "mousemove",
                    move
                );

                document.removeEventListener(
                    "mouseup",
                    stop
                );


                const state=
                    pages[currentPage];


                if(
                    state &&
                    state.overlays[index]
                ){

                    state.overlays[index].x=
                        parseFloat(
                            element.style.left
                        );


                    state.overlays[index].y=
                        parseFloat(
                            element.style.top
                        );

                }

            }


            document.addEventListener(
                "mousemove",
                move
            );


            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );

}

        .getElementById(
            "extraPDF"
        )
        .click();

}


document
.getElementById("extraPDF")
.addEventListener(
    "change",
    importPDFPages
);


async function importPDFPages(event){

    const file=
        event.target.files[0];

    if(!file)
        return;


    try{

        saveState();

        loading(
            "Importing PDF pages..."
        );


        const bytes=
            new Uint8Array(
                await file.arrayBuffer()
            );


        const imported=
            await pdfjsLib.getDocument({
                data:bytes
            }).promise;


        const newPages=[];


        for(
            let i=1;
            i<=imported.numPages;
            i++
        ){

            const page=
                await imported.getPage(i);


            const viewport=
                page.getViewport({
                    scale:2
                });


            const canvas=
                document.createElement(
                    "canvas"
                );


            canvas.width=
                viewport.width;

            canvas.height=
                viewport.height;


            await page.render({

                canvasContext:
                    canvas.getContext("2d"),

                viewport:viewport

            }).promise;


            newPages.push({

                type:"imagePage",

                src:
                    canvas.toDataURL(
                        "image/png"
                    ),

                width:
                    viewport.width,

                height:
                    viewport.height,

                rotation:0,

                overlays:[]

            });

        }


        pages.splice(
            currentPage+1,
            0,
            ...newPages
        );


        currentPage++;


        await renderThumbnails();

        await renderCurrentPage();

        closeAddMenu();

        hideLoading();


        status(
            newPages.length+
            " PDF page(s) added"
        );

    }
    catch(error){

        hideLoading();

        alert(
            "Could not import PDF."
        );

    }


    event.target.value="";

}

async function importPPTPages(event){

    if(!file)

    try{

        saveState();

        loading(
            "Importing PPTX slides..."
        );


        const bytes=

                await file.arrayBuffer()

        const imported=
            await parsePPTX(bytes);


        pages.splice(
            currentPage+1,
            0,
            ...imported
        );


        currentPage++;


        await renderThumbnails();

        await renderCurrentPage();

        closeAddMenu();

        hideLoading();


        status(
            imported.length+
            " slide(s) added"
        );

    }
    catch(error){

        hideLoading();

        console.error(error);

        alert(
            "Could not import PPTX."
        );

    }


    event.target.value="";

}


/* =========================================================
BLANK PAGE / SLIDE
========================================================= */

function addBlankPage(){

    saveState();


    if(mode==="ppt"){

        pages.splice(
            currentPage+1,

            {

                type:"ppt",

                width:13.333,

/* =========================================================
DELETE
========================================================= */

function deleteCurrentPage(){

    deletePage(
        currentPage
    );

}


function deletePage(index){

    if(pages.length<=1){

        alert(
            "At least one page/slide is required."
        );

        return;

    }


    saveState();


    pages.splice(
        index,
        1
    );


    if(
        currentPage>=pages.length
    ){

        currentPage=
            pages.length-1;

    }


    renderThumbnails();

    renderCurrentPage();

    status(
        mode==="ppt"
        ?
        "Slide deleted"
        :
        "Page deleted"
    );

}


/* =========================================================
NAVIGATION
========================================================= */

function previousPage(){

    if(currentPage>0){

        currentPage--;

        renderThumbnails();

        renderCurrentPage();

    }

}


function nextPage(){

    if(
        currentPage<
        pages.length-1
    ){

        currentPage++;

        renderThumbnails();

        renderCurrentPage();

    }

}


/* =========================================================
ROTATE
========================================================= */

function rotatePage(){

    if(!pages.length)
        return;


    saveState();


    pages[currentPage].rotation=
        (
            pages[currentPage].rotation+
            90
        )%360;


    renderThumbnails();

    renderCurrentPage();

}


/* =========================================================
PAGE NUMBERS
========================================================= */

function addPageNumbers(){

    if(!pages.length)
        return;


    saveState();


    pages.forEach(
        (state,index)=>{

            if(!state.overlays)
                state.overlays=[];


            state.overlays.push({

                type:"text",

                text:String(index+1),

                x:280,

                y:760,

                size:18,

                color:"#000000",

    );

        "Page numbers added"
    );

}


/* =========================================================
CLEAR
========================================================= */

function clearItems(){

        return;

    pages[currentPage].overlays=[];


    renderCurrentPage();

    status(
        "Added items cleared"
    );

}


/* =========================================================
ZOOM
========================================================= */

function zoomIn(){

    zoom=
        Math.min(
            3,
            zoom+.15
        );


    renderCurrentPage();

}


function zoomOut(){

    zoom=
        Math.max(
            .5,
            zoom-.15
        );

}


/* =========================================================
UNDO / REDO
========================================================= */

function saveState(){

    undoStack.push(
        JSON.stringify(pages)
    );


    if(
        undoStack.length>30
    ){

        undoStack.shift();

    }


    redoStack=[];

}


async function undo(){

    if(!undoStack.length){

        status(
            "Nothing to undo"
        );

        return;

    }


    redoStack.push(
        JSON.stringify(pages)
    );


    pages=
        JSON.parse(
            undoStack.pop()
        );


    currentPage=
        Math.min(
            currentPage,
            pages.length-1
        );


    await renderThumbnails();

    await renderCurrentPage();

}


async function redo(){

    if(!redoStack.length){

        status(
            "Nothing to redo"
        );

        return;

    }


    undoStack.push(
        JSON.stringify(pages)
    );


    pages=
        JSON.parse(
            redoStack.pop()
        );


    currentPage=
        Math.min(
            currentPage,
            pages.length-1
        );


    await renderThumbnails();

    await renderCurrentPage();

}

/* =========================================================
EXPORT PDF
========================================================= */

async function exportPDF(){

    loading(
        "Creating PDF..."
    );


    const output=
        await PDFLib.PDFDocument.create();


    const font=
        await output.embedFont(
            PDFLib.StandardFonts.Helvetica
        );


    let originalPDFDoc=null;


    if(originalPDF){

        originalPDFDoc=
            await PDFLib.PDFDocument.load(
                originalPDF
            );

    }


    for(
        const state of pages
    ){

        let page;


        /*
         * Original PDF
         */

        if(
            state.type==="pdf"
        ){

            const copied=
                await output.copyPages(
                    originalPDFDoc,
                    [state.pageNumber-1]
                );


            page=copied[0];

            output.addPage(page);


            if(state.rotation){

                page.setRotation(
                    PDFLib.degrees(
                        state.rotation
                    )
                );

            }

        }


        /*
         * Blank
         */

        else if(
            state.type==="blank"
        ){

            let w=state.width;

            let h=state.height;


            if(
                state.rotation===90 ||
                state.rotation===270
            ){

                [w,h]=[h,w];

            }


            page=
                output.addPage([
                    w,
                    h
                ]);

        }


        /*
         * Image page
         */

        else if(
            state.type==="imagePage"
        ){

            const img=
                await output.embedPng(
                    state.src
                );


            let w=img.width;

            let h=img.height;


            const maxW=595;

            const maxH=842;


            const scale=
                Math.min(
                    maxW/w,
                    maxH/h,
                    1
                );


            w*=scale;

            h*=scale;


            page=
                output.addPage([
                    w,
                    h
                ]);


            page.drawImage(
                img,
                {
                    x:0,
                    y:0,
                    width:w,
                    height:h
                }
            );


            if(state.rotation){

                page.setRotation(
                    PDFLib.degrees(
                        state.rotation
                    )
                );

            }

        }


        /*
         * PPT slide converted to PDF
         */

        else if(
            state.type==="ppt"
        ){

            const canvas=
                document.createElement(
                    "canvas"
                );


            canvas.width=
                1280;

            canvas.height=
                720;


            drawPPTToCanvas(
                canvas,
                state,
                false
            );


            const png=
                canvas.toDataURL(
                    "image/png"
                );


            const img=
                await output.embedPng(
                    png
                );


            page=
                output.addPage([
                    960,
                    540
                ]);


            page.drawImage(
                img,
                {
                    x:0,
                    y:0,
                    width:960,
                    height:540
                }
            );

        }


        if(!page)
            continue;


        /*
         * Add overlays
         */

        await drawPDFOverlays(
            page,
            state,
            output,
            font
        );

    }


    const bytes=
        await output.save();


    downloadBlob(
        new Blob(
            [bytes],
            {
                type:
                    "application/pdf"
            }
        ),
        "edited-document.pdf"
    );


    hideLoading();

    status(
        "PDF downloaded"
    );

}


/* =========================================================
DRAW PDF OVERLAYS
========================================================= */

async function drawPDFOverlays(
    page,
    state,
    output,
    font
){

    if(!state.overlays)
        return;


    const size=
        page.getSize();


    for(
        const item of state.overlays
    ){

        if(
            item.type==="text" ||
            item.type==="watermark"
        ){

            const c=
                hexRGB(
                    item.color
                );


            page.drawText(
                item.text,
                {

                    x:
                        item.x/
                        zoom,

                    y:
                        size.height-
                        (
                            item.y+
                            item.size
                        )/
                        zoom,

                    size:
                        item.size/
                        zoom,

                    font:font,

                    color:
                        PDFLib.rgb(
                            c.r,
                            c.g,
                            c.b
                        ),

                    opacity:
                        item.opacity

                }
            );

        }


        if(
            item.type==="image"
        ){

            try{

                let image;


                if(
                    item.src
                    .startsWith(
                        "data:image/png"
                    )
                ){

                    image=
                        await output.embedPng(
                            item.src
                        );

                }
                else{

                    image=
                        await output.embedJpg(
                            item.src
                        );

                }


                page.drawImage(
                    image,
                    {

                        x:
                            item.x/
                            zoom,

                        y:
                            size.height-
                            (
                                item.y+
                                item.height
                            )/
                            zoom,

                        width:
                            item.width/
                            zoom,

                        height:
                            item.height/
                            zoom

                    }
                );

            }
            catch(error){

                console.log(error);

            }

        }

    }

}


/* =========================================================
EXPORT PPTX
========================================================= */

async function exportPPTX(){

    loading(
        "Creating PowerPoint..."
    );


    const pptx=
        new pptxgen();


    pptx.layout=
        "LAYOUT_WIDE";


    pptx.author=
        "Free PDF & PPT Editor";


    pptx.subject=
        "Edited presentation";


    pptx.title=
        "Edited Presentation";


    pptx.company=
        "Free PDF & PPT Editor";


    for(
        const state of pages
    ){

        const slide=
            pptx.addSlide();


        /*
         * White background
         */

        slide.background={
            color:"FFFFFF"
        };


        /*
         * Existing PPT elements
         */

        if(
            state.type==="ppt" &&
            state.elements
        ){

            for(
                const item of state.elements
            ){

                if(
                    item.type==="pptText"
                ){

                    slide.addText(
                        item.text,
                        {

                            x:item.x,

                            y:item.y,

                            w:
                                item.w||
                                5,

                            h:
                                item.h||
                                1,

                            fontSize:
                                item.fontSize||
                                24,

                            color:
                                (
                                    item.color||
                                    "#000000"
                                ).replace(
                                    "#",
                                    ""
                                ),

                            margin:0.05,

                            breakLine:false

                        }
                    );

                }


                if(
                    item.type==="pptImage"
                ){

                    slide.addImage({

                        data:item.src,

                        x:item.x,

                        y:item.y,

                        w:item.w,

                        h:item.h

                    });

                }

            }

        }


        /*
         * Image page
         */

        if(
            state.type==="imagePage"
        ){

            slide.addImage({

                data:state.src,

                x:0,

                y:0,

                w:13.333,

                h:7.5

            });

        }


        /*
         * PDF page
         *
         * Render it to an image because PPTX
         * cannot directly contain a PDF page.
         */

        if(
            state.type==="pdf"
        ){

            const canvas=
                document.createElement(
                    "canvas"
                );


            canvas.width=
                1280;

            canvas.height=
                720;


            const page=
                await pdfDocument.getPage(
                    state.pageNumber
                );


            const viewport=
                page.getViewport({
                    scale:1
                });


            const scale=
                Math.min(
                    1280/viewport.width,
                    720/viewport.height
                );


            const finalViewport=
                page.getViewport({
                    scale:scale
                });


            canvas.width=
                finalViewport.width;

            canvas.height=
                finalViewport.height;


            await page.render({

                canvasContext:
                    canvas.getContext("2d"),

                viewport:
                    finalViewport

            }).promise;


            slide.addImage({

                data:
                    canvas.toDataURL(
                        "image/png"
                    ),

                x:0,

                y:0,

                w:13.333,

                h:7.5

            });

        }


        /*
         * Blank pages need no background.
         */


        /*
         * Added overlays
         */

        if(state.overlays){

            for(
                const item of state.overlays
            ){

                if(
                    item.type==="text" ||
                    item.type==="watermark"
                ){

                    slide.addText(
                        item.text,
                        {

                            x:
                                pixelsToInches(
                                    item.x,
                                    state
                                ),

                            y:
                                pixelsToInches(
                                    item.y,
                                    state
                                ),

                            w:4,

                            h:1,

                            fontSize:
                                item.size||
                                24,

                            color:
                                item.color
                                .replace(
                                    "#",
                                    ""
                                ),

                            transparency:
                                Math.round(
                                    (
                                        1-
                                        item.opacity
                                    )*100
                                ),

                            margin:0.02

                        }
                    );

                }


                if(
                    item.type==="image"
                ){

                    slide.addImage({

                        data:item.src,

                        x:
                            pixelsToInches(
                                item.x,
                                state
                            ),

                        y:
                            pixelsToInches(
                                item.y,
                                state
                            ),

                        w:
                            pixelsToInches(
                                item.width,
                                state
                            ),

                        h:
                            pixelsToInches(
                                item.height,
                                state
                            )

                    });

                }

            }

        }

    }


    await pptx.writeFile({
        fileName:
            "edited-presentation.pptx"
    });


    hideLoading();

    status(
        "PPTX downloaded"
    );

}


/* =========================================================
PIXELS TO PPT INCHES
========================================================= */

function pixelsToInches(
    pixels,
    state
){

    /*
     * Editor uses approximately 96 CSS pixels
     * per inch.
     */

    return pixels/
        (
            96*
            zoom
        );

}


/* =========================================================
HEX RGB
========================================================= */

function hexRGB(hex){

    hex=
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(0,2),
                16
            )/255,

        g:
            parseInt(
                hex.substring(2,4),
                16
            )/255,

        b:
            parseInt(
                hex.substring(4,6),
                16
            )/255

    };

}


/* =========================================================
DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url=
        URL.createObjectURL(
            blob
        );


    const a=
        document.createElement(
            "a"
        );


    a.href=url;

    a.download=filename;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        1000
    );

}

KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(

    function(e){

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

        }


        if(
            e.key==="ArrowRight" &&
            !e.ctrlKey
        ){

            nextPage();

        }


        if(
            e.key==="ArrowLeft" &&
            !e.ctrlKey
        ){

            previousPage();

        }


        /*
         * Delete selected added element
         */

        if(e.key==="Delete"){

            const selected=
                document.querySelector(
                    ".element.selected"
                );


            if(selected){

                const index=
                    Number(
                        selected.dataset.index
                    );


                saveState();


                pages[currentPage]
                    .overlays
                    .splice(
                        index,
                        1
                    );


                renderCurrentPage();

            }

        }

    }
);
